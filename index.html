<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIWA CASINO | Premium Slot</title>
    <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #080808; --card-dark: #121212; --accent-blue: #3d85ff;
            --gold: #ffcc00; --gold-dark: #b8860b; --text-main: #e0e0e0; --text-dim: #777;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg-dark); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        body.casino-mode { background: radial-gradient(circle at center, #1a0f00 0%, #050505 100%); }
        
        #main-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.5s; }
        .liquid-ring { width: 60px; height: 60px; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--gold); animation: rotate 1s linear infinite; }
        @keyframes rotate { to { transform: rotate(360deg); } }

        .container { width: 92%; max-width: 380px; opacity: 0; transition: 0.8s; }
        #customPopup { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(150%); background: #fff; color: #000; padding: 10px 20px; border-radius: 50px; font-weight: 800; z-index: 10000; transition: 0.3s; }
        #customPopup.show { transform: translateX(-50%) translateY(0); }

        /* Styles Global untuk semua halaman */
        .modern-card { background: var(--card-dark); border-radius: 40px; padding: 40px 30px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.03); text-align: center; }
        .ip-display { background: #181818; padding: 25px; border-radius: 25px; border: 1px solid #222; margin: 25px 0; cursor: pointer; position: relative; }
        .ip-display label { font-size: 10px; color: var(--accent-blue); font-weight: 800; display: block; margin-bottom: 8px; letter-spacing: 1px; }
        .ip-display span { font-family: 'Goldman'; font-size: 22px; color: #fff; }
        .guide-box { text-align: left; background: rgba(61, 133, 255, 0.05); padding: 15px; border-radius: 20px; font-size: 12px; border: 1px solid rgba(61, 133, 255, 0.1); margin-bottom: 20px; line-height: 1.6; }
        .guide-box b { color: var(--accent-blue); }
        .btn-gold { width: 100%; padding: 20px; border-radius: 25px; border: none; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #000; font-family: 'Goldman'; font-weight: 800; cursor: pointer; }
        .btn-blue { width: 100%; padding: 18px; border-radius: 20px; border: 1px solid #333; background: #1a1a1a; color: var(--accent-blue); font-weight: 800; cursor: pointer; font-size: 14px; }
        
        /* Slot UI */
        .casino-ui { background: #0a0a0a; border: 3px solid var(--gold); border-radius: 45px; padding: 30px 20px; box-shadow: 0 0 50px rgba(0,0,0,1); position: relative; }
        .slot-window { height: 120px; background: #000; border-radius: 25px; display: flex; justify-content: center; gap: 10px; padding: 0 15px; overflow: hidden; border: 2px solid #222; margin-bottom: 25px; position: relative; }
        .slot-window::before { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; box-shadow: inset 0 20px 20px #000, inset 0 -20px 20px #000; z-index: 2; pointer-events: none; }
        .reel-strip { display: flex; flex-direction: column; align-items: center; position: absolute; width: 100%; }
        .slot-item { height: 120px; min-height: 120px; display: flex; align-items: center; justify-content: center; font-size: 50px; }
        @keyframes spin-loop { from { transform: translateY(0); } to { transform: translateY(-1200px); } }
        .spinning { animation: spin-loop 0.2s linear infinite; }
    </style>
</head>
<body>

    <div id="main-loader">
        <div class="liquid-ring"></div>
        <p style="font-family:'Goldman'; color:var(--gold); margin-top:20px; font-size:10px; letter-spacing:3px">AUTHENTICATING...</p>
    </div>

    <div id="customPopup">Alert</div>
    <div class="container" id="app-viewport"></div>

<script>

const SECRET = "dimas_ganteng_123"

const SYMS = ['🍇','🍉','🍋','🍌','🍎','🍑','🍒','🫐','🥥','🥑']

let API_URL = localStorage.getItem('MIWA_API') || ''

let userData = {
    ip:'',
    profile:{}
}

/* =========================
   POPUP
========================= */

function showPopup(text){

    const popup =
    document.getElementById('popup')

    popup.innerText = text

    popup.classList.add('show')

    setTimeout(()=>{
        popup.classList.remove('show')
    },2500)
}

/* =========================
   NAVIGATION STEP
========================= */

function navigateTo(step){

    const app =
    document.getElementById('app')

    app.style.opacity = 0

    setTimeout(()=>{

        if(step === 'step1'){
            renderApiInput()
        }

        if(step === 'step2'){
            renderProfile()
        }

        if(step === 'step3'){
            renderSlotPage()
        }

        app.style.opacity = 1

    },300)
}

/* =========================
   STEP 1
========================= */

function renderApiInput(){

    document.getElementById('app').innerHTML = `
    <div class="card">

        <div class="title">
            MIWA CASINO
        </div>

        <div class="subtitle">
            Masukkan URL API slot kamu terlebih dahulu untuk melanjutkan.
        </div>

        <div class="input-box">
            <label>API URL</label>

            <input
            type="text"
            id="apiInput"
            placeholder="https://domain.com/api/slot-web"
            value="${API_URL}"
            >
        </div>

        <button class="btn btn-gold" onclick="saveApi()">
            CONNECT API
        </button>

    </div>
    `
}

/* =========================
   STEP 2
========================= */

function renderProfile(){

    const data = userData.profile

    document.getElementById('app').innerHTML = `
    <div class="card">

        <div class="profile">

            <img src="${data.img}" />

            <h2>${data.name}</h2>

            <div class="badge">
                ${data.owner
                ? 'OWNER 👑'
                : data.premium
                ? 'PREMIUM PLAYER ✨'
                : 'REGULER PLAYER'}
            </div>

        </div>

        <div class="stats">

            <div class="stat">
                <h3>SALDO</h3>

                <p>
                Rp ${Number(data.uang)
                .toLocaleString('id-ID')}
                </p>
            </div>

            <div class="stat">
                <h3>LIMIT</h3>

                <p>${data.limit}</p>
            </div>

        </div>

        <button
        class="btn btn-gold"
        style="margin-top:25px"
        onclick="navigateTo('step3')"
        >
        ENTER SLOT
        </button>

    </div>
    `
}

/* =========================
   STEP 3
========================= */

function renderSlotPage(){

    const data = userData.profile

    document.getElementById('app').innerHTML = `
    <div class="card">

        <div class="profile">

            <img src="${data.img}" />

            <h2>${data.name}</h2>

            <div class="badge">
                CASINO MODE 🎰
            </div>

        </div>

        <div class="stats">

            <div class="stat">
                <h3>SALDO</h3>

                <p id="saldoText">
                Rp ${Number(data.uang)
                .toLocaleString('id-ID')}
                </p>
            </div>

            <div class="stat">
                <h3>LIMIT</h3>

                <p>${data.limit}</p>
            </div>

        </div>

        <div class="slot-box">

            <div class="reels">

                <div class="reel" id="r1">🎰</div>
                <div class="reel" id="r2">🎰</div>
                <div class="reel" id="r3">🎰</div>

            </div>

            <div class="bet-box input-box">

                <label>BET AMOUNT</label>

                <input
                type="number"
                id="betInput"
                placeholder="Minimal 5000"
                />

            </div>

            <button
            class="btn btn-gold spin-btn"
            id="spinBtn"
            onclick="playGame()"
            >
            SPIN MACHINE
            </button>

            <button
            class="btn"
            style="
            margin-top:15px;
            background:#1a1a1a;
            color:#fff;
            border:1px solid #2a2a2a;
            "
            onclick="navigateTo('step2')"
            >
            BACK PROFILE
            </button>

        </div>

    </div>
    `
}

/* =========================
   SAVE API
========================= */

function saveApi(){

    const val =
    document.getElementById('apiInput')
    .value.trim()

    if(!val)
    return showPopup('Masukkan API URL!')

    API_URL = val

    localStorage.setItem('MIWA_API',val)

    location.reload()
}

/* =========================
   START APP
========================= */
 
async function startApp(){

    try{

        if(!API_URL){

            document.getElementById('main-loader')
            .style.display = 'none'

            navigateTo('step1')

            return
        }

        const resIp =
        await fetch('https://api.ipify.org?format=json')

        const dataIp =
        await resIp.json()

        userData.ip = dataIp.ip

        const res =
        await fetch(API_URL,{
            method:'POST',
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify({
                type:'checkIP',
                ip:userData.ip,
                secret:SECRET
            })
        })

        const auth =
        await res.json()

        document.getElementById('main-loader')
        .style.opacity = 0

        setTimeout(()=>{

            document.getElementById('main-loader')
            .style.display = 'none'

            if(auth.status){

                userData.profile = auth.profile

                navigateTo('step2')

            } else {

                navigateTo('step1')

                showPopup(
                    auth.msg ||
                    'IP belum terdaftar'
                )
            }

        },700)

    } catch(err){

        console.log(err)

        const loader =
        document.getElementById('main-loader')

        loader.innerHTML = `
        <div class="error-box">

            <div class="error-icon">
                ⚠️
            </div>

            <h2 class="error-title">
                API FAILED
            </h2>

            <p class="error-desc">
                Gagal terhubung ke server API.<br>
                Pastikan URL API benar & server online.
            </p>

            <button
            class="btn retry-btn"
            onclick="resetApi()"
            >
            CHANGE API
            </button>

        </div>
        `
    }
}

/* =========================
   RESET API
========================= */

function resetApi(){

    localStorage.removeItem('MIWA_API')

    location.reload()
}

/* =========================
   PLAY GAME
========================= */

let cooldown = false

async function playGame(){

    if(cooldown)
    return

    const bet =
    parseInt(
        document.getElementById('betInput')
        .value
    )

    if(!bet || bet < 5000)
    return showPopup('Minimal bet Rp 5.000')

    const spinBtn =
    document.getElementById('spinBtn')

    spinBtn.disabled = true

    try{

        let spin =
        setInterval(()=>{

            document.getElementById('r1')
            .innerText =
            SYMS[Math.floor(
            Math.random()*SYMS.length)]

            document.getElementById('r2')
            .innerText =
            SYMS[Math.floor(
            Math.random()*SYMS.length)]

            document.getElementById('r3')
            .innerText =
            SYMS[Math.floor(
            Math.random()*SYMS.length)]

        },100)

        const res =
        await fetch(API_URL,{
            method:'POST',
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify({
                ip:userData.ip,
                amount:bet,
                secret:SECRET
            })
        })

        const data =
        await res.json()

        setTimeout(()=>{

            clearInterval(spin)

            if(!data.status){

                spinBtn.disabled = false

                return showPopup(data.msg)
            }

            document.getElementById('r1')
            .innerText = data.reels[0]

            document.getElementById('r2')
            .innerText = data.reels[1]

            document.getElementById('r3')
            .innerText = data.reels[2]

            userData.profile = data.profile

            document.getElementById('saldoText')
            .innerText =
            'Rp ' +
            Number(data.profile.uang)
            .toLocaleString('id-ID')

            showPopup(data.resultStatus)

            startCooldown()

        },2500)

    } catch(err){

        console.log(err)

        spinBtn.disabled = false

        showPopup('Koneksi Error!')
    }
}

/* =========================
   COOLDOWN
========================= */

function startCooldown(){

    const btn =
    document.getElementById('spinBtn')

    cooldown = true

    let sec = 60

    btn.classList.add('cooldown')

    const timer =
    setInterval(()=>{

        btn.innerText =
        `WAIT ${sec}s`

        sec--

        if(sec < 0){

            clearInterval(timer)

            cooldown = false

            btn.disabled = false

            btn.classList.remove('cooldown')

            btn.innerText =
            'SPIN MACHINE'
        }

    },1000)
}

startApp()

</script>
</body>
</html>
