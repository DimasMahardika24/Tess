<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIWA CASINO | Premium Slot</title>
    <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #080808; --card-dark: #121212; --accent-blue: #3d85ff;
            --gold: #ffcc00; --gold-dark: #b8860b; --text-main: #e0e0e0; --text-dim: #777;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg-dark); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        body.casino-mode { background: radial-gradient(circle at center, #1a0f00 0%, #050505 100%); }
        
        #main-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.5s; }
        .liquid-ring { width: 60px; height: 60px; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--gold); animation: rotate 1s linear infinite; }
        @keyframes rotate { to { transform: rotate(360deg); } }

        .container { width: 92%; max-width: 380px; opacity: 0; transition: 0.8s; }
        #customPopup { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(150%); background: #fff; color: #000; padding: 10px 20px; border-radius: 50px; font-weight: 800; z-index: 10000; transition: 0.3s; }
        #customPopup.show { transform: translateX(-50%) translateY(0); }

        /* Styles Global untuk semua halaman */
        .modern-card { background: var(--card-dark); border-radius: 40px; padding: 40px 30px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.03); text-align: center; }
        .ip-display { background: #181818; padding: 25px; border-radius: 25px; border: 1px solid #222; margin: 25px 0; cursor: pointer; position: relative; }
        .ip-display label { font-size: 10px; color: var(--accent-blue); font-weight: 800; display: block; margin-bottom: 8px; letter-spacing: 1px; }
        .ip-display span { font-family: 'Goldman'; font-size: 22px; color: #fff; }
        .guide-box { text-align: left; background: rgba(61, 133, 255, 0.05); padding: 15px; border-radius: 20px; font-size: 12px; border: 1px solid rgba(61, 133, 255, 0.1); margin-bottom: 20px; line-height: 1.6; }
        .guide-box b { color: var(--accent-blue); }
        .btn-gold { width: 100%; padding: 20px; border-radius: 25px; border: none; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #000; font-family: 'Goldman'; font-weight: 800; cursor: pointer; }
        .btn-blue { width: 100%; padding: 18px; border-radius: 20px; border: 1px solid #333; background: #1a1a1a; color: var(--accent-blue); font-weight: 800; cursor: pointer; font-size: 14px; }
        
        /* Slot UI */
        .casino-ui { background: #0a0a0a; border: 3px solid var(--gold); border-radius: 45px; padding: 30px 20px; box-shadow: 0 0 50px rgba(0,0,0,1); position: relative; }
        .slot-window { height: 120px; background: #000; border-radius: 25px; display: flex; justify-content: center; gap: 10px; padding: 0 15px; overflow: hidden; border: 2px solid #222; margin-bottom: 25px; position: relative; }
        .slot-window::before { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; box-shadow: inset 0 20px 20px #000, inset 0 -20px 20px #000; z-index: 2; pointer-events: none; }
        .reel-strip { display: flex; flex-direction: column; align-items: center; position: absolute; width: 100%; }
        .slot-item { height: 120px; min-height: 120px; display: flex; align-items: center; justify-content: center; font-size: 50px; }
        @keyframes spin-loop { from { transform: translateY(0); } to { transform: translateY(-1200px); } }
        .spinning { animation: spin-loop 0.2s linear infinite; }
    </style>
</head>
<body>

    <div id="main-loader">
        <div class="liquid-ring"></div>
        <p style="font-family:'Goldman'; color:var(--gold); margin-top:20px; font-size:10px; letter-spacing:3px">AUTHENTICATING...</p>
    </div>

    <div id="customPopup">Alert</div>
    <div class="container" id="app-viewport"></div>

    <script>
        const SECRET = "dimas_ganteng_123";
        const SYMS = ['🍇', '🍉', '🍋', '🍌', '🍎', '🍑', '🍒', '🫐', '🥥', '🥑'];
        let userData = { ip: '', profile: {} };

        async function navigateTo(page) {
            const viewport = document.getElementById('app-viewport');
            viewport.style.opacity = '0';
            
            try {
                const res = await fetch(`pages/${page}.html`);
                const html = await res.text();
                
                setTimeout(() => {
                    viewport.innerHTML = html;
                    viewport.style.opacity = '1';
                    
                    if (page === 'step1') {
                        document.getElementById('userIP').innerText = userData.ip;
                    }
                    if (page === 'step2') syncProfile();
                    if (page === 'step3') {
                        initReels();
                        document.getElementById('displayMoney').innerText = "Rp " + userData.profile.uang.toLocaleString();
                        document.body.classList.add('casino-mode');
                    } else {
                        document.body.classList.remove('casino-mode');
                    }
                }, 400);
            } catch (e) { console.error(e); }
        }

        async function startApp() {
            try {
                const resIp = await fetch('https://api.ipify.org?format=json');
                const dataIp = await resIp.json();
                userData.ip = dataIp.ip;

                const resAuth = await fetch(`/api/slot-web`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ type: 'checkIP', ip: userData.ip, secret: SECRET })
                });
                const auth = await resAuth.json();

                document.getElementById('main-loader').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('main-loader').style.display = 'none';
                    if(auth.status) {
                        userData.profile = auth.profile;
                        navigateTo('step2');
                    } else {
                        navigateTo('step1');
                    }
                }, 1000);
            } catch (e) { console.error(e); }
        }

        function syncProfile() {
            document.getElementById('pName').innerText = userData.profile.name;
            document.getElementById('pUang').innerText = "Rp " + userData.profile.uang.toLocaleString();
            document.getElementById('pLimit').innerText = userData.profile.limit;
            document.getElementById('pImg').src = userData.profile.img || 'https://telegra.ph/file/default.jpg';
        }

        function copyIP() {
            navigator.clipboard.writeText(userData.ip);
            showPopup("IP Copied!");
        }

        function showPopup(msg) {
            const p = document.getElementById('customPopup');
            p.innerText = msg; p.classList.add('show');
            setTimeout(() => p.classList.remove('show'), 2500);
        }

        function initReels() {
            for(let i=1; i<=3; i++) {
                const strip = document.getElementById('strip'+i);
                strip.innerHTML = '';
                for(let j=0; j<15; j++) {
                    const item = document.createElement('div');
                    item.className = 'slot-item';
                    item.innerText = SYMS[Math.floor(Math.random()*SYMS.length)];
                    strip.appendChild(item);
                }
            }
        }

        let cooldownTimer = null; // Penjaga timer global

async function playGame() {
    const betInput = document.getElementById('betInput');
    const bet = parseInt(betInput.value);
    const spinBtn = document.getElementById('spinBtn');
    const controls = document.getElementById('ui-controls');

    // 1. CEK LOKAL (GAK PAKE LAMA)
    if (spinBtn.classList.contains('cooldown-active')) return;
    if (!bet || bet < 5000) return showPopup("MIN BET Rp 5.000");
    if (userData.profile.uang < bet) return showPopup("SALDO TIDAK CUKUP!");

    spinBtn.disabled = true;

    try {
        // 2. CEK SERVER (COOLDOWN & LIMIT)
        const res = await fetch(`/api/slot-web`, {
            method: "POST", 
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ type: 'playByIP', ip: userData.ip, amount: bet, secret: SECRET })
        });
        
        const data = await res.json();

        // JIKA KENA COOLDOWN DARI SERVER
        if (!data.status && data.msg.includes('Tunggu')) {
            const timeParts = data.msg.match(/\d+/g); 
            let totalSeconds = (parseInt(timeParts[0]) * 60) + parseInt(timeParts[1]);
            startCooldownButton(totalSeconds);
            return;
        }

        if (!data.status) {
            spinBtn.disabled = false;
            return showPopup(data.msg);
        }

        // --- 3. MULAI AKSI ---
        controls.classList.add('hide-controls'); // Sembunyikan tombol

        for (let i = 1; i <= 3; i++) {
            document.getElementById('strip' + i).classList.add('spinning');
        }

        // Stop Reel Berurutan
        [0, 1, 2].forEach(i => {
            setTimeout(() => {
                const strip = document.getElementById('strip' + (i + 1));
                strip.classList.remove('spinning');
                strip.querySelectorAll('.slot-item')[0].innerText = data.reels[i];
            }, 1200 + (i * 800));
        });

        // SELESAI
        setTimeout(() => {
            userData.profile = data.profile;
            document.getElementById('displayMoney').innerText = "Rp " + data.profile.uang.toLocaleString();
            
            controls.classList.remove('hide-controls'); // Munculkan tombol
            startCooldownButton(60); // Paksa cooldown 1 menit setelah main

            setTimeout(() => {
                showPopup(data.resultStatus);
            }, 300);

        }, 3800);

    } catch (e) {
        controls.classList.remove('hide-controls');
        spinBtn.disabled = false;
        showPopup("Koneksi Error!");
    }
}

// FUNGSI TIMER TOMBOL
function startCooldownButton(seconds) {
    const spinBtn = document.getElementById('spinBtn');
    if (cooldownTimer) clearInterval(cooldownTimer);
    
    spinBtn.disabled = true;
    spinBtn.classList.add('cooldown-active');

    let remaining = seconds;
    cooldownTimer = setInterval(() => {
        let m = Math.floor(remaining / 60);
        let s = remaining % 60;
        spinBtn.innerText = `WAIT (${m}:${s < 10 ? '0' + s : s})`;
        remaining--;

        if (remaining < 0) {
            clearInterval(cooldownTimer);
            spinBtn.disabled = false;
            spinBtn.classList.remove('cooldown-active');
            spinBtn.innerText = "SPIN MACHINE";
        }
    }, 1000);
}



        startApp();
    </script>
</body>
</html>
