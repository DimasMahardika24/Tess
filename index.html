<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miwa Dashboard | Professional Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e11;
            --card: #151921;
            --input: #1f2632;
            --accent: #3d8bff;
            --accent-glow: rgba(61, 139, 255, 0.3);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --border: #2d3748;
            --success: #10b981;
            --error: #ef4444;
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: var(--card);
            width: 90%;
            max-width: 400px;
            border-radius: 32px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            text-align: center;
            position: relative;
        }

        .back-btn {
            position: absolute; top: 25px; left: 25px;
            background: var(--input); border: 1px solid var(--border);
            color: var(--text-main); width: 35px; height: 35px;
            border-radius: 12px; display: flex; align-items: center;
            justify-content: center; cursor: pointer; z-index: 10; font-weight: bold;
        }

        h1 { font-weight: 800; letter-spacing: -1.5px; margin-bottom: 5px; font-size: 28px; }

        .profile-card {
            background: var(--input); border-radius: 24px; padding: 20px;
            margin-top: 10px; border: 1px solid var(--border);
            display: none; animation: slideUp 0.6s ease;
        }

        .profile-img {
            width: 65px; height: 65px; border-radius: 18px;
            border: 2px solid var(--accent); margin-bottom: 10px;
            object-fit: cover; box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Update balance-info untuk box tunggal */
        .balance-info { margin-top: 12px; }
        .b-box {
            background: rgba(0,0,0,0.3); padding: 15px; border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .b-box label { display: block; font-size: 9px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; }
        .b-box span { display: block; color: var(--text-main); font-weight: 800; font-size: 18px; margin-top: 2px; }

        .game-menu { margin-top: 25px; text-align: left; }
        .menu-label { font-size: 11px; font-weight: 700; color: var(--text-dim); letter-spacing: 1.5px; margin-bottom: 15px; display: block; }

        .game-item {
            width: 100%; background: var(--input); border: 1px solid var(--border);
            border-radius: 20px; padding: 12px 16px; margin-bottom: 12px;
            display: flex; align-items: center; cursor: pointer; position: relative;
        }

        .game-item.active:hover { border-color: var(--accent); background: rgba(61, 139, 255, 0.05); }
        .game-item.locked { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

        .game-icon {
            width: 45px; height: 45px; background: rgba(0,0,0,0.2);
            border-radius: 14px; display: flex; align-items: center;
            justify-content: center; font-size: 22px; margin-right: 15px;
        }

        .game-details { flex: 1; }
        .game-title { display: block; font-size: 14px; font-weight: 700; color: var(--text-main); }
        .game-subtitle { display: block; font-size: 10px; font-weight: 600; color: var(--success); }
        .locked .game-subtitle { color: var(--text-dim); }

        .game-badge {
            font-size: 10px; background: var(--border); color: var(--text-dim);
            padding: 4px 8px; border-radius: 8px; font-weight: 700;
        }

        input {
            width: 100%; background: var(--input); border: 1px solid var(--border);
            padding: 16px 20px; border-radius: 18px; color: #fff;
            margin-bottom: 16px; outline: none; font-size: 15px;
        }

        .btn {
            width: 100%; padding: 16px; background: var(--accent);
            color: white; border: none; border-radius: 18px;
            font-weight: 700; cursor: pointer; box-shadow: 0 8px 25px var(--accent-glow);
            text-transform: uppercase;
        }

        .btn:disabled { background: #2d3748; color: #64748b; cursor: not-allowed; box-shadow: none; }

        .reels { display: flex; gap: 12px; justify-content: center; margin: 30px 0; }
        .reel {
            width: 85px; height: 85px; background: #000; border-radius: 20px;
            font-size: 40px; line-height: 85px; border: 1px solid var(--border);
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.8);
        }

        .step { display: none; }
        .active { display: block; animation: fadeIn 0.5s ease forwards; }
        
        .hide-game-ui { 
            opacity: 0 !important; 
            pointer-events: none !important; 
            transform: translateY(15px); 
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        #customPopup {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: var(--card); border: 1px solid var(--border);
            padding: 15px 25px; border-radius: 20px; z-index: 999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); opacity: 0;
        }
        #customPopup.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div id="customPopup">
        <div id="popMsg" style="font-size: 14px; font-weight: 600;">Pesan di sini</div>
    </div>

    <div class="container">
        <h1>MIWA</h1>
        
        <div id="step-1" class="step active">
            <p style="color: var(--text-dim); font-size: 14px; margin-bottom: 25px;">Sesi Aman & Terverifikasi</p>
            <input type="text" id="phoneInput" placeholder="Masukkan Nomor (628...)">
            <button class="btn" id="checkBtn" onclick="checkAccount()">Otorisasi Akun</button>
        </div>

        <div id="step-2" class="step">
            <div id="profileContent" class="profile-card">
                <img id="pImg" src="" class="profile-img">
                <h3 id="pName" style="margin:0; font-size: 18px;">...</h3>
                <div class="balance-info">
                    <div class="b-box"><label>SALDO AKTIF</label><span id="pUang">Rp 0</span></div>
                </div>
            </div>
            
            <div id="countdownArea" style="margin-top:25px; font-size: 13px; color: var(--accent); font-weight: 600;">
                MEMUAT MODUL GAME... (<span id="cdText">5</span>)
            </div>

            <div id="gameList" class="game-menu" style="display:none;">
                <span class="menu-label">PILIH PERMAINAN</span>
                
                <div class="game-item active" onclick="openGame()">
                    <div class="game-icon">🎰</div>
                    <div class="game-details">
                        <span class="game-title">SLOT GENERAL</span>
                        <span class="game-subtitle">ONLINE</span>
                    </div>
                    <div class="game-badge" style="color: var(--accent);">PLAY</div>
                </div>

                <div class="game-item locked">
                    <div class="game-icon">🎡</div>
                    <div class="game-details">
                        <span class="game-title">ROULETTE ROYALE</span>
                        <span class="game-subtitle">COMING SOON</span>
                    </div>
                    <div class="game-badge">LOCKED</div>
                </div>

                <div class="game-item locked">
                    <div class="game-icon">🚀</div>
                    <div class="game-details">
                        <span class="game-title">CRASH GALAXY</span>
                        <span class="game-subtitle">DEVELOPMENT</span>
                    </div>
                    <div class="game-badge">LOCKED</div>
                </div>

                <div style="text-align: center; margin-top: 20px;">
                    <button onclick="logout()" style="background:none; border:none; color:var(--text-dim); font-size: 11px; cursor:pointer; font-weight: 600;">KELUAR SESI</button>
                </div>
            </div>
        </div>

        <div id="step-3" class="step">
            <div id="backArea" class="back-btn" onclick="goBack()">&larr;</div>
            <p style="color: var(--accent); font-weight: 800; font-size: 11px; letter-spacing: 2px; margin-bottom: 10px;">MESIN SLOT AKTIF</p>
            <div class="reels">
                <div id="r1" class="reel">💎</div>
                <div id="r2" class="reel">💎</div>
                <div id="r3" class="reel">💎</div>
            </div>
            <div id="controlArea">
                <input type="number" id="betInput" placeholder="Jumlah Taruhan (5k-50k)">
                <button class="btn" id="spinBtn" onclick="playGame()">PUTAR SEKARANG</button>
            </div>
            <p id="game-msg" style="font-size: 12px; margin-top: 20px; color: var(--text-dim); font-weight: 700;"></p>
        </div>
    </div>

    <script>
        const SECRET = "dimas_ganteng_123";
        const CD_HOURLY = 5 * 60 * 1000; 
        let userData = {};
        let userUang = 0;

        window.onload = () => {
            const savedUser = localStorage.getItem('miwa_user');
            if(savedUser) {
                userData = JSON.parse(savedUser);
                loadProfileAuto();
            }
            checkCooldown();
        };

        function showPopup(msg) {
            const p = document.getElementById('customPopup');
            document.getElementById('popMsg').innerText = msg;
            p.classList.add('show');
            setTimeout(() => p.classList.remove('show'), 3000);
        }

        async function checkAccount() {
            const num = document.getElementById('phoneInput').value;
            const btn = document.getElementById('checkBtn');
            if(!num) return showPopup("Masukkan nomor WhatsApp!");
            btn.disabled = true; btn.innerText = "VERIFIKASI...";
            try {
                const res = await fetch(`/api/slot-web`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nomor: num, amount: 0, secret: SECRET, type: 'check' })
                });
                const data = await res.json();
                if(data.status || data.msg.includes("Minimal")) { 
                    userData = { nomor: num, profile: data.profile };
                    localStorage.setItem('miwa_user', JSON.stringify(userData));
                    loadProfileUI(data);
                } else {
                    showPopup("Akun tidak ditemukan!");
                    btn.disabled = false; btn.innerText = "OTORISASI AKUN";
                }
            } catch (e) { showPopup("Server Offline!"); btn.disabled = false; }
        }

        function loadProfileAuto() {
            showStep(2);
            updateProfileDisplay(userData.profile);
            startMenuTimer();
        }

        function loadProfileUI(data) {
            showStep(2);
            updateProfileDisplay(data.profile);
            startMenuTimer();
        }

        function updateProfileDisplay(profile) {
            document.getElementById('profileContent').style.display = 'block';
            document.getElementById('pName').innerText = profile?.name || "User Miwa";
            userUang = profile?.uang || 0;
            document.getElementById('pUang').innerText = "Rp " + userUang.toLocaleString();
            document.getElementById('pImg').src = profile?.img || "https://img1.pixhost.to/images/11480/682392173_dhikzxcloud.jpg";
        }

        function startMenuTimer() {
            let cd = 5;
            const cdText = document.getElementById('cdText');
            const itv = setInterval(() => {
                cd--;
                if(cdText) cdText.innerText = cd;
                if(cd <= 0) {
                    clearInterval(itv);
                    document.getElementById('countdownArea').style.display = 'none';
                    document.getElementById('gameList').style.display = 'block';
                }
            }, 1000);
        }

        function showStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step-'+n).classList.add('active');
        }

        function openGame() { showStep(3); checkCooldown(); }
        
        function goBack() { 
            const isSpinning = document.getElementById('controlArea').classList.contains('hide-game-ui');
            if(!isSpinning) showStep(2); 
        }

        async function playGame() {
            const betInput = document.getElementById('betInput');
            const bet = Math.abs(parseInt(betInput.value));
            const reels = [document.getElementById('r1'), document.getElementById('r2'), document.getElementById('r3')];
            const controlArea = document.getElementById('controlArea');
            const backArea = document.getElementById('backArea');
            const msgEl = document.getElementById('game-msg');

            if(!bet || bet < 5000) return showPopup("Minimal taruhan Rp 5.000");
            if(bet > userUang) return showPopup("Saldo tidak cukup!");
            
            controlArea.classList.add('hide-game-ui');
            backArea.classList.add('hide-game-ui');
            msgEl.innerText = "MENUNGGU HASIL...";
            
            const anims = reels.map(r => setInterval(() => {
                r.innerText = ['🍎','🍇','🍒','💎','🍋','🔔'][Math.floor(Math.random()*6)];
            }, 70));

            try {
                const res = await fetch(`/api/slot-web`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nomor: userData.nomor, amount: bet, secret: SECRET })
                });
                const data = await res.json();

                if(data.status) {
                    setTimeout(() => { clearInterval(anims[0]); reels[0].innerText = data.reels[0]; }, 1000);
                    setTimeout(() => { clearInterval(anims[1]); reels[1].innerText = data.reels[1]; }, 1800);
                    setTimeout(() => { 
                        clearInterval(anims[2]); 
                        reels[2].innerText = data.reels[2];
                        controlArea.classList.remove('hide-game-ui');
                        backArea.classList.remove('hide-game-ui');
                        finishGame(data);
                    }, 2600);
                } else {
                    anims.forEach(a => clearInterval(a));
                    controlArea.classList.remove('hide-game-ui');
                    backArea.classList.remove('hide-game-ui');
                    showPopup(data.msg);
                    msgEl.innerText = "";
                }
            } catch (e) { 
                anims.forEach(a => clearInterval(a));
                controlArea.classList.remove('hide-game-ui');
                backArea.classList.remove('hide-game-ui');
                showPopup("Koneksi Putus!");
                msgEl.innerText = "";
            }
        }

        function finishGame(data) {
            document.getElementById('game-msg').innerText = "RESULT: " + data.resultStatus;
            if(data.currentUang !== undefined) {
                userUang = data.currentUang;
                document.getElementById('pUang').innerText = "Rp " + userUang.toLocaleString();
            }
            localStorage.setItem('lastSpinTime', Date.now().toString());
            startGlobalCooldown(CD_HOURLY);
            if(data.resultStatus.toLowerCase().includes('win')) showPopup("JACKPOT! Saldo bertambah.");
        }

        function checkCooldown() {
            const lastSpin = localStorage.getItem('lastSpinTime');
            if (lastSpin) {
                const elapsed = Date.now() - parseInt(lastSpin);
                if (elapsed < CD_HOURLY) startGlobalCooldown(CD_HOURLY - elapsed);
            }
        }

        function startGlobalCooldown(ms) {
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            const itv = setInterval(() => {
                ms -= 1000;
                let min = Math.floor(ms / 60000), sec = Math.floor((ms % 60000) / 1000);
                btn.innerText = `COOLDOWN (${min}:${sec < 10 ? '0'+sec : sec})`;
                if(ms <= 0) {
                    clearInterval(itv);
                    btn.disabled = false; btn.innerText = "PUTAR SEKARANG";
                    localStorage.removeItem('lastSpinTime');
                }
            }, 1000);
        }

        function logout() {
            if(confirm("Keluar dari sesi ini?")) {
                localStorage.removeItem('miwa_user');
                location.reload();
            }
        }
    </script>
</body>
</html>
