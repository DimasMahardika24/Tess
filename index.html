<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>MIWA CASINO | PREMIUM SLOT</title>

<link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#050505;
    --card:#111111;
    --card2:#181818;
    --gold:#ffcc00;
    --gold2:#ff9100;
    --blue:#3d85ff;
    --red:#ff3e3e;
    --green:#00ff88;
    --text:#ffffff;
    --soft:#9a9a9a;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:
    radial-gradient(circle at top,#1a1100 0%,#050505 60%);
    font-family:'Plus Jakarta Sans',sans-serif;
    color:var(--text);
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:92%;
    max-width:420px;
    opacity:0;
    transition:.5s;
}

/* LOADER */

#main-loader{
    position:fixed;
    inset:0;
    background:#050505;
    z-index:99999;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    transition:.4s;
}

.loader-logo{
    width:120px;
    height:120px;
    border-radius:35px;
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:50px;
    color:#000;
    box-shadow:
    0 0 30px rgba(255,204,0,.4),
    0 0 80px rgba(255,145,0,.2);
    animation:float 2s infinite ease-in-out;
}

.loader-ring{
    position:absolute;
    width:170px;
    height:170px;
    border-radius:50%;
    border:3px solid transparent;
    border-top:3px solid var(--gold);
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes float{
    0%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-8px);
    }
    100%{
        transform:translateY(0px);
    }
}

/* CARD */

.card{
    background:rgba(17,17,17,.96);
    border:1px solid rgba(255,255,255,.04);
    border-radius:35px;
    padding:30px;
    box-shadow:
    0 0 40px rgba(0,0,0,.6),
    inset 0 0 20px rgba(255,255,255,.02);
    backdrop-filter:blur(20px);
}

.title{
    font-family:'Goldman';
    font-size:28px;
    text-align:center;
    background:linear-gradient(135deg,var(--gold),#fff0a6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:var(--soft);
    font-size:13px;
    margin-bottom:30px;
    line-height:1.7;
}

/* INPUT */

.input-box{
    margin-bottom:18px;
}

.input-box label{
    display:block;
    font-size:12px;
    font-weight:700;
    margin-bottom:10px;
    color:var(--gold);
    letter-spacing:1px;
}

.input-box input{
    width:100%;
    height:58px;
    border:none;
    outline:none;
    background:#1a1a1a;
    border:1px solid #2a2a2a;
    border-radius:18px;
    padding:0 20px;
    color:#fff;
    font-size:15px;
    transition:.3s;
}

.input-box input:focus{
    border-color:var(--gold);
    box-shadow:0 0 20px rgba(255,204,0,.15);
}

.btn{
    width:100%;
    height:58px;
    border:none;
    border-radius:20px;
    font-family:'Goldman';
    font-size:15px;
    cursor:pointer;
    transition:.3s;
}

.btn-gold{
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    color:#000;
    box-shadow:0 0 30px rgba(255,204,0,.2);
}

.btn-gold:hover{
    transform:translateY(-2px);
}

/* PROFILE */

.profile{
    text-align:center;
}

.profile img{
    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid var(--gold);
    margin-bottom:15px;
    box-shadow:0 0 30px rgba(255,204,0,.3);
}

.profile h2{
    font-family:'Goldman';
    margin-bottom:8px;
}

.badge{
    display:inline-block;
    padding:8px 16px;
    border-radius:999px;
    font-size:11px;
    font-weight:800;
    margin-top:8px;
    background:rgba(255,204,0,.12);
    color:var(--gold);
    border:1px solid rgba(255,204,0,.2);
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-top:25px;
}

.stat{
    background:#181818;
    border-radius:20px;
    padding:18px;
    border:1px solid #222;
}

.stat h3{
    font-size:11px;
    color:#888;
    margin-bottom:10px;
}

.stat p{
    font-size:18px;
    font-weight:800;
}

/* SLOT */

.slot-box{
    margin-top:25px;
    background:#0a0a0a;
    border-radius:30px;
    border:2px solid rgba(255,204,0,.2);
    padding:20px;
}

.reels{
    display:flex;
    gap:10px;
    justify-content:center;
}

.reel{
    width:90px;
    height:90px;
    border-radius:20px;
    background:#151515;
    border:1px solid #2a2a2a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    box-shadow:inset 0 0 15px rgba(255,255,255,.03);
}

.bet-box{
    margin-top:20px;
}

.spin-btn{
    margin-top:18px;
}

.cooldown{
    opacity:.6;
}

/* POPUP */

#popup{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translateX(-50%) translateY(200%);
    background:#fff;
    color:#000;
    padding:14px 25px;
    border-radius:999px;
    font-weight:800;
    z-index:999999;
    transition:.3s;
}

#popup.show{
    transform:translateX(-50%) translateY(0%);
}

/* ERROR */

.error-box{
    text-align:center;
}

.error-icon{
    width:110px;
    height:110px;
    margin:auto;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(255,62,62,.08);
    border:2px solid rgba(255,62,62,.15);
    font-size:55px;
    color:var(--red);
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.08);
    }
    100%{
        transform:scale(1);
    }
}

.error-title{
    margin-top:25px;
    font-family:'Goldman';
    color:var(--red);
    letter-spacing:2px;
}

.error-desc{
    margin-top:12px;
    color:#999;
    line-height:1.8;
    font-size:13px;
}

.retry-btn{
    margin-top:25px;
    background:linear-gradient(135deg,#ff3e3e,#b80000);
    color:#fff;
}
</style>
</head>
<body>

<div id="main-loader">
    <div class="loader-ring"></div>

    <div class="loader-logo">
        🎰
    </div>

    <p style="
    margin-top:30px;
    font-family:'Goldman';
    letter-spacing:3px;
    color:var(--gold);
    font-size:11px;
    ">
    CONNECTING API...
    </p>
</div>

<div class="container" id="app"></div>

<div id="popup">Alert</div>

<script>

const SECRET = "dimas_ganteng_123"

const SYMS = ['🍇','🍉','🍋','🍌','🍎','🍑','🍒','🫐','🥥','🥑']

let API_URL = localStorage.getItem('MIWA_API') || ''

let userData = {
    ip:'',
    profile:{}
}

/* POPUP */

function showPopup(text){

    const popup =
    document.getElementById('popup')

    popup.innerText = text

    popup.classList.add('show')

    setTimeout(()=>{
        popup.classList.remove('show')
    },2500)
}

/* PAGE */

function renderApiInput(){

    document.getElementById('app').innerHTML = `
    <div class="card">

        <div class="title">
            MIWA CASINO
        </div>

        <div class="subtitle">
            Masukkan URL API slot kamu terlebih dahulu untuk melanjutkan.
        </div>

        <div class="input-box">
            <label>API URL</label>

            <input
            type="text"
            id="apiInput"
            placeholder="https://domain.com/api/slot-web"
            value="${API_URL}"
            >
        </div>

        <button class="btn btn-gold" onclick="saveApi()">
            CONNECT API
        </button>

    </div>
    `

    document.getElementById('app').style.opacity = 1
}

function renderProfile(){

    const data = userData.profile

    document.getElementById('app').innerHTML = `
    <div class="card">

        <div class="profile">

            <img src="${data.img}" />

            <h2>${data.name}</h2>

            <div class="badge">
                PREMIUM PLAYER
            </div>

        </div>

        <div class="stats">

            <div class="stat">
                <h3>SALDO</h3>
                <p>
                Rp ${Number(data.uang).toLocaleString('id-ID')}
                </p>
            </div>

            <div class="stat">
                <h3>LIMIT</h3>
                <p>${data.limit}</p>
            </div>

        </div>

        <div class="slot-box">

            <div class="reels">

                <div class="reel" id="r1">🎰</div>
                <div class="reel" id="r2">🎰</div>
                <div class="reel" id="r3">🎰</div>

            </div>

            <div class="bet-box input-box">

                <label>BET AMOUNT</label>

                <input
                type="number"
                id="betInput"
                placeholder="Minimal 5000"
                />

            </div>

            <button
            class="btn btn-gold spin-btn"
            id="spinBtn"
            onclick="playGame()"
            >
            SPIN MACHINE
            </button>

        </div>

    </div>
    `
}

/* SAVE API */

function saveApi(){

    const val =
    document.getElementById('apiInput').value.trim()

    if(!val)
    return showPopup('Masukkan API URL!')

    API_URL = val

    localStorage.setItem('MIWA_API',val)

    location.reload()
}

/* START */

async function startApp(){

    try{

        if(!API_URL){

            document.getElementById('main-loader').style.display = 'none'

            renderApiInput()

            return
        }

        const resIp =
        await fetch('https://api.ipify.org?format=json')

        const dataIp =
        await resIp.json()

        userData.ip = dataIp.ip

        const res =
        await fetch(API_URL,{
            method:'POST',
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify({
                type:'checkIP',
                ip:userData.ip,
                secret:SECRET
            })
        })

        const auth =
        await res.json()

        document.getElementById('main-loader').style.opacity = 0

        setTimeout(()=>{

            document.getElementById('main-loader').style.display = 'none'

            if(auth.status){

                userData.profile = auth.profile

                renderProfile()

                document.getElementById('app').style.opacity = 1

            } else {

                renderApiInput()

                showPopup(auth.msg || 'IP belum terdaftar')

            }

        },700)

    } catch(err){

        console.log(err)

        const loader =
        document.getElementById('main-loader')

        loader.innerHTML = `
        <div class="error-box">

            <div class="error-icon">
                ⚠️
            </div>

            <h2 class="error-title">
                API FAILED
            </h2>

            <p class="error-desc">
                Gagal terhubung ke server API.<br>
                Pastikan URL API benar & server online.
            </p>

            <button
            class="btn retry-btn"
            onclick="resetApi()"
            >
            CHANGE API
            </button>

        </div>
        `
    }
}

/* RESET API */

function resetApi(){

    localStorage.removeItem('MIWA_API')

    location.reload()
}

/* PLAY */

let cooldown = false

async function playGame(){

    if(cooldown)
    return

    const bet =
    parseInt(
        document.getElementById('betInput').value
    )

    if(!bet || bet < 5000)
    return showPopup('Minimal bet Rp 5.000')

    const spinBtn =
    document.getElementById('spinBtn')

    spinBtn.disabled = true

    try{

        let spin =
        setInterval(()=>{

            document.getElementById('r1').innerText =
            SYMS[Math.floor(Math.random()*SYMS.length)]

            document.getElementById('r2').innerText =
            SYMS[Math.floor(Math.random()*SYMS.length)]

            document.getElementById('r3').innerText =
            SYMS[Math.floor(Math.random()*SYMS.length)]

        },100)

        const res =
        await fetch(API_URL,{
            method:'POST',
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify({
                ip:userData.ip,
                amount:bet,
                secret:SECRET
            })
        })

        const data =
        await res.json()

        setTimeout(()=>{

            clearInterval(spin)

            if(!data.status){

                spinBtn.disabled = false

                return showPopup(data.msg)
            }

            document.getElementById('r1').innerText =
            data.reels[0]

            document.getElementById('r2').innerText =
            data.reels[1]

            document.getElementById('r3').innerText =
            data.reels[2]

            userData.profile = data.profile

            renderProfile()

            showPopup(data.resultStatus)

            startCooldown()

        },2500)

    } catch(err){

        console.log(err)

        spinBtn.disabled = false

        showPopup('Koneksi Error!')
    }
}

/* COOLDOWN */

function startCooldown(){

    const btn =
    document.getElementById('spinBtn')

    cooldown = true

    let sec = 60

    btn.classList.add('cooldown')

    const timer =
    setInterval(()=>{

        btn.innerText =
        `WAIT ${sec}s`

        sec--

        if(sec < 0){

            clearInterval(timer)

            cooldown = false

            btn.disabled = false

            btn.classList.remove('cooldown')

            btn.innerText =
            'SPIN MACHINE'
        }

    },1000)
}

startApp()

</script>
</body>
</html>
