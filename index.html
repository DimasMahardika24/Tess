<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miwa Slot V2 | Modern Dark Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #ffd700;
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
            --border: #333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .slot-container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }

        h1 { 
            font-weight: 900; 
            font-size: 28px; 
            margin: 0; 
            background: linear-gradient(to bottom, #fff, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .tagline { color: var(--text-dim); font-size: 12px; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; }

        /* Slot Reels Styling */
        .reels-wrapper {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 30px;
        }

        .reel-box {
            flex: 1;
            height: 100px;
            background: #252525;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            border: 2px solid var(--border);
            transition: all 0.2s ease;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
        }

        .reel-box.spinning {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
            transform: scale(1.05);
        }

        /* Input Styling */
        .input-area { text-align: left; margin-bottom: 20px; }
        label { font-size: 11px; font-weight: 700; color: var(--accent); margin-left: 5px; opacity: 0.8; }
        
        input {
            width: 100%;
            box-sizing: border-box;
            background: #2a2a2a;
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            margin-top: 5px;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--accent); background: #333; }

        /* Button Styling */
        .btn-glow {
            width: 100%;
            padding: 18px;
            background: var(--accent);
            border: none;
            border-radius: 14px;
            color: #000;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-glow:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(255, 215, 0, 0.5); }
        .btn-glow:active { transform: scale(0.98); }
        .btn-glow:disabled { background: #444; color: #777; box-shadow: none; cursor: wait; }

        #status-msg {
            margin-top: 25px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dim);
            transition: 0.3s;
        }

        .footer-note { margin-top: 20px; font-size: 10px; color: #444; }
    </style>
</head>
<body>

    <div class="slot-container">
        <h1>MIWA SLOT</h1>
        <div class="tagline">Exclusive for Dhikzx Project</div>

        <div class="reels-wrapper">
            <div id="r1" class="reel-box">💎</div>
            <div id="r2" class="reel-box">💎</div>
            <div id="r3" class="reel-box">💎</div>
        </div>

        <div class="input-area">
            <label>TARGET WHATSAPP</label>
            <input type="text" id="targetWA" placeholder="628xxxxxx">
        </div>

        <div class="input-area">
            <label>BET AMOUNT (MIN 5.000)</label>
            <input type="number" id="betVal" placeholder="5000">
        </div>

        <button class="btn-glow" id="spinBtn" onclick="runSlot()">SPIN MACHINE</button>

        <div id="status-msg">Silakan tentukan bet dan nomor WA kamu</div>
        <div class="footer-note">Secure connection to Pterodactyl 4510</div>
    </div>

    <script>
        const symbols = ['🍇', '🍉', '🍋', '🍌', '🍎', '🍑', '🍒', '🫐', '🥥', '🥑'];
        const SECRET = "dimas_ganteng_123";

        async function runSlot() {
            const num = document.getElementById('targetWA').value;
            const bet = document.getElementById('betVal').value;
            const btn = document.getElementById('spinBtn');
            const msg = document.getElementById('status-msg');
            const reels = [document.getElementById('r1'), document.getElementById('r2'), document.getElementById('r3')];

            if(!num || !bet) return alert("Lengkapi data dulu!");
            if(bet < 5000) return alert("Bet minimal Rp 5.000");

            // UI State: Loading
            btn.disabled = true;
            msg.innerText = "🌀 Menghubungkan ke Server...";
            msg.style.color = "var(--text-dim)";

            // Start Animasi Rolling (Lama: 3.5 detik)
            reels.forEach(r => r.classList.add('spinning'));
            let startTime = Date.now();
            const animInterval = setInterval(() => {
                reels.forEach(r => {
                    r.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                });
            }, 80);

            try {
                // Request ke Bot (Lewat Netlify Proxy)
                const response = await fetch(`/api/slot-web`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nomor: num, amount: bet, secret: SECRET })
                });

                const data = await response.json();
                
                // Cek apakah minimal sudah 3.5 detik biar animasinya kerasa
                let elapsedTime = Date.now() - startTime;
                let remainingTime = Math.max(3500 - elapsedTime, 0);

                setTimeout(() => {
                    clearInterval(animInterval);
                    reels.forEach(r => r.classList.remove('spinning'));

                    if (data.status) {
                        reels[0].innerText = data.reels[0];
                        reels[1].innerText = data.reels[1];
                        reels[2].innerText = data.reels[2];

                        if (data.resultStatus === 'JACKPOT') {
                            msg.innerText = `🏆 JACKPOT! +Rp ${data.winAmount.toLocaleString()}`;
                            msg.style.color = "#ffd700";
                        } else if (data.resultStatus === 'ALMOST') {
                            msg.innerText = `🤏 ALMOST! Cashback Rp ${data.winAmount.toLocaleString()}`;
                            msg.style.color = "#4ade80";
                        } else {
                            msg.innerText = `❌ LOSE! Bet Rp ${bet} hangus.`;
                            msg.style.color = "#ff4d4d";
                        }
                    } else {
                        msg.innerText = `⚠️ ${data.msg}`;
                        msg.style.color = "#ffa500";
                    }
                    btn.disabled = false;
                }, remainingTime);

            } catch (err) {
                clearInterval(animInterval);
                reels.forEach(r => r.classList.remove('spinning'));
                msg.innerText = "❌ ERROR: Koneksi ke Bot Terputus!";
                msg.style.color = "#ff4d4d";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
