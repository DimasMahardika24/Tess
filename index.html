<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIWA CASINO | Premium Slot</title>
    <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #080808; --card-dark: #121212; --accent-blue: #3d85ff;
            --gold: #ffcc00; --gold-dark: #b8860b; --text-main: #e0e0e0;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg-dark); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        body.casino-mode { background: radial-gradient(circle at center, #1a0f00 0%, #050505 100%); }
        
        /* PREVIEW LOADER */
        #main-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.5s; }
        .liquid-ring { width: 60px; height: 60px; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--gold); animation: rotate 1s linear infinite; }
        @keyframes rotate { to { transform: rotate(360deg); } }

        .container { width: 92%; max-width: 380px; display: none; opacity: 0; transition: 0.8s; }
        .modern-card { background: var(--card-dark); border-radius: 40px; padding: 40px 30px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.03); text-align: center; }
        
        /* SLOT MACHINE UI */
        .casino-ui { background: #0a0a0a; border: 3px solid var(--gold); border-radius: 45px; padding: 30px 20px; box-shadow: 0 0 50px rgba(0,0,0,1); position: relative; }
        
        /* REEL SYSTEM (MODERN) */
        .slot-window { 
            height: 120px; background: #000; border-radius: 25px; 
            display: flex; justify-content: center; gap: 10px; padding: 0 15px;
            overflow: hidden; border: 2px solid #222; margin-bottom: 25px;
            position: relative;
        }
        .slot-window::before { /* Efek Bayangan Dalam */
            content: ''; position: absolute; top:0; left:0; width:100%; height:100%;
            box-shadow: inset 0 20px 20px #000, inset 0 -20px 20px #000; z-index: 2; pointer-events: none;
        }
        
        .reel-column { 
            width: 75px; position: relative; height: 100%;
            transition: transform 0.5s cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }

        /* Container untuk item yang berputar */
        .reel-strip {
            display: flex; flex-direction: column; align-items: center;
            position: absolute; width: 100%; left: 0; top: 0;
        }

        .slot-item { 
            height: 120px; min-height: 120px; display: flex; 
            align-items: center; justify-content: center; font-size: 50px; 
        }

        /* ANIMASI SPIN KENCENG */
        @keyframes spin-loop {
            from { transform: translateY(0); }
            to { transform: translateY(-1200px); } /* Berputar melewati 10 item */
        }
        .spinning { animation: spin-loop 0.2s linear infinite; }

        /* BUTTONS & INPUT */
        .btn-gold { 
            width: 100%; padding: 20px; border-radius: 25px; border: none; 
            background: linear-gradient(135deg, var(--gold), var(--gold-dark)); 
            color: #000; font-family: 'Goldman'; font-weight: 800; cursor: pointer;
        }
        .btn-gold:disabled { filter: grayscale(1); cursor: not-allowed; }

        .stat-item { background: #181818; padding: 15px; border-radius: 20px; border: 1px solid #252525; margin-bottom: 10px; }
        .stat-item b { color: #00ff88; font-size: 18px; }

        .step { display: none; }
        .active-step { display: block !important; }
        #customPopup { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(150%); background: #fff; color: #000; padding: 10px 20px; border-radius: 50px; font-weight: 800; z-index: 10000; transition: 0.3s; }
        #customPopup.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body id="mainBody">

    <div id="main-loader">
        <div class="liquid-ring"></div>
        <p style="font-family:'Goldman'; color:var(--gold); margin-top:20px; font-size:10px; letter-spacing:3px">LOADING MIWA</p>
    </div>

    <div id="customPopup">Alert</div>

    <div class="container" id="mainContainer">
        <div id="step-1" class="step">
            <div class="modern-card">
                <h2>Unauthorized</h2>
                <div style="background:#222; padding:20px; border-radius:20px; margin:20px 0;">
                    <span id="userIP" style="font-family:'Goldman'; font-size:20px;">...</span>
                </div>
                <button class="btn-gold" style="color:#fff; background:#333" onclick="location.reload()">RE-CHECK</button>
            </div>
        </div>

        <div id="step-2" class="step">
            <div class="modern-card">
                <img id="pImg" src="" style="width:100px; border-radius:50%; margin-bottom:15px; border:3px solid var(--accent-blue)">
                <h2 id="pName" style="margin:0">...</h2>
                <div style="display:flex; gap:10px; margin:20px 0;">
                    <div class="stat-item" style="flex:1"><small>CREDITS</small><br><b id="pUang">0</b></div>
                    <div class="stat-item" style="flex:1"><small>LIMIT</small><br><b id="pLimit" style="color:#fff">0</b></div>
                </div>
                <button class="btn-gold" onclick="showStep(3)">PLAY NOW</button>
            </div>
        </div>

        <div id="step-3" class="step">
            <div class="casino-ui">
                <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom:20px">
                    <span onclick="showStep(2)" style="cursor:pointer; font-size:12px; font-weight:800; color:var(--gold)" id="btnExit">BACK</span>
                    <span id="displayMoney" style="color:#00ff88; font-weight:800">0</span>
                </div>

                <div class="slot-window">
                    <div class="reel-column"><div id="strip1" class="reel-strip"></div></div>
                    <div class="reel-column"><div id="strip2" class="reel-strip"></div></div>
                    <div class="reel-column"><div id="strip3" class="reel-strip"></div></div>
                </div>

                <input type="number" id="betInput" style="width:100%; background:#111; border:1px solid #333; padding:15px; border-radius:20px; color:#fff; text-align:center; margin-bottom:10px; font-family:'Goldman'" placeholder="BET">
                <button class="btn-gold" id="spinBtn" onclick="playGame()">SPIN MACHINE</button>
            </div>
        </div>
    </div>

    <script>
        const SECRET = "dimas_ganteng_123";
        const SYMS = ['🍇', '🍉', '🍋', '🍌', '🍎', '🍑', '🍒', '🫐', '🥥', '🥑'];
        let userData = { ip: '' };

        // Inisialisasi Reel awal
        function initReels() {
            for(let i=1; i<=3; i++) {
                const strip = document.getElementById('strip'+i);
                strip.innerHTML = '';
                // Isi dengan 10 item acak untuk efek visual
                for(let j=0; j<15; j++) {
                    const item = document.createElement('div');
                    item.className = 'slot-item';
                    item.innerText = SYMS[Math.floor(Math.random()*SYMS.length)];
                    strip.appendChild(item);
                }
            }
        }

        async function startApp() {
            initReels();
            const loader = document.getElementById('main-loader');
            const container = document.getElementById('mainContainer');

            try {
                const resIp = await fetch('https://api.ipify.org?format=json');
                const dataIp = await resIp.json();
                userData.ip = dataIp.ip;
                document.getElementById('userIP').innerText = dataIp.ip;

                const resAuth = await fetch(`/api/slot-web`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ type: 'checkIP', ip: userData.ip, secret: SECRET })
                });
                const auth = await resAuth.json();

                setTimeout(() => {
                    loader.style.opacity = '0';
                    setTimeout(() => {
                        loader.style.display = 'none';
                        container.style.display = 'block';
                        container.style.opacity = '1';
                        if(auth.status) { updateUI(auth.profile); showStep(2); }
                        else { showStep(1); }
                    }, 500);
                }, 3000);
            } catch (e) { console.error(e); }
        }

        function showStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active-step'));
            document.getElementById('step-' + n).classList.add('active-step');
            if(n === 3) document.getElementById('mainBody').classList.add('casino-mode');
            else document.getElementById('mainBody').classList.remove('casino-mode');
        }

        function updateUI(p) {
            document.getElementById('pName').innerText = p.name;
            document.getElementById('pUang').innerText = "Rp " + p.uang.toLocaleString();
            document.getElementById('displayMoney').innerText = "Rp " + p.uang.toLocaleString();
            document.getElementById('pLimit').innerText = p.limit;
            document.getElementById('pImg').src = p.img || "https://telegra.ph/file/default.jpg";
        }

        // --- LOGIKA SPIN NYATA ---
        async function playGame() {
            const bet = parseInt(document.getElementById('betInput').value);
            if(!bet || bet < 5000) return showPopup("MIN BET 5,000");

            const spinBtn = document.getElementById('spinBtn');
            const btnExit = document.getElementById('btnExit');
            
            // Disable UI
            spinBtn.disabled = true;
            btnExit.style.opacity = '0';
            btnExit.style.pointerEvents = 'none';

            // 1. Mulai Spin Kenceng (Loop)
            for(let i=1; i<=3; i++) {
                document.getElementById('strip'+i).classList.add('spinning');
            }

            try {
                const res = await fetch(`/api/slot-web`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ type: 'playByIP', ip: userData.ip, amount: bet, secret: SECRET })
                });
                const data = await res.json();

                if(data.status) {
                    // 2. Berhenti Satu Per Satu (Inersia)
                    [0, 1, 2].forEach(i => {
                        setTimeout(() => {
                            const strip = document.getElementById('strip'+(i+1));
                            strip.classList.remove('spinning');
                            
                            // Pasang item hasil di paling atas
                            const items = strip.querySelectorAll('.slot-item');
                            items[0].innerText = data.reels[i];
                            
                            // Efek Bounce (Membal)
                            strip.style.transform = 'translateY(15px)';
                            setTimeout(() => strip.style.transform = 'translateY(0)', 200);

                        }, 1000 + (i * 800)); // Delay berhenti antar reel
                    });

                    // 3. Selesai
                    setTimeout(() => {
                        spinBtn.disabled = false;
                        btnExit.style.opacity = '1';
                        btnExit.style.pointerEvents = 'auto';
                        showPopup(data.resultStatus);
                        updateUI(data.profile);
                    }, 3500);

                } else { throw new Error(data.msg); }
            } catch(e) {
                for(let i=1; i<=3; i++) document.getElementById('strip'+i).classList.remove('spinning');
                spinBtn.disabled = false;
                btnExit.style.opacity = '1';
                showPopup(e.message);
            }
        }

        function showPopup(msg) {
            const p = document.getElementById('customPopup');
            p.innerText = msg; p.classList.add('show');
            setTimeout(() => p.classList.remove('show'), 2500);
        }

        startApp();
    </script>
</body>
</html>
