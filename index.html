<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIWA CASINO | Ultra Smooth</title>
    <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ffcc00; --gold-dark: #b8860b; --bg-dark: #050505; 
            --card-bg: #111111; --text: #ffffff; --border: #333333;
        }
        * { box-sizing: border-box; }
        body { 
            background-color: var(--bg-dark); 
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%); 
            color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; overflow: hidden; 
        }
        .container { 
            background: var(--card-bg); width: 95%; max-width: 420px; 
            border-radius: 40px; padding: 40px 30px; border: 2px solid var(--gold-dark); 
            box-shadow: 0 0 50px rgba(0,0,0,1); text-align: center; position: relative; 
        }
        h1 { font-family: 'Goldman', cursive; font-size: 32px; color: var(--gold); text-shadow: 0 0 15px var(--gold-dark); margin-bottom: 20px; }
        
        /* SLOT MACHINE STYLES */
        .slot-machine { 
            background: #000; border: 4px solid var(--gold-dark); 
            border-radius: 20px; padding: 20px 10px; margin: 20px 0; 
            position: relative; overflow: hidden;
            box-shadow: inset 0 0 30px rgba(255,204,0,0.2);
        }
        .reels-container { display: flex; gap: 10px; justify-content: center; height: 120px; overflow: hidden; position: relative; }
        
        /* Kunci animasi smooth ada di sini */
        .reel-strip {
            display: flex; flex-direction: column; width: 90px;
            transition: transform 0.1s linear; /* Smooth linear motion */
        }
        .symbol {
            height: 120px; line-height: 120px; font-size: 60px;
            background: linear-gradient(to bottom, #222, #111, #222);
            border: 1px solid #333; border-radius: 10px;
        }

        /* UI ELEMENTS */
        .profile-card { background: #1a1a1a; border-radius: 20px; padding: 15px; border: 1px solid var(--border); margin-bottom: 20px; display: none; }
        .stat-box { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 12px; border: 1px solid #222; flex: 1; }
        .stat-box label { font-size: 10px; color: var(--gold); font-weight: 800; display: block; }
        
        input { width: 100%; background: #1a1a1a; border: 2px solid var(--border); padding: 18px; border-radius: 20px; color: #fff; margin-bottom: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .btn-gold { width: 100%; padding: 18px; background: linear-gradient(to bottom, var(--gold), #b8860b); color: #000; border: none; border-radius: 20px; font-weight: 800; cursor: pointer; font-family: 'Goldman'; font-size: 16px; box-shadow: 0 5px 0 #7a5a00; text-transform: uppercase; transition: 0.2s; }
        .btn-gold:disabled { background: #444 !important; box-shadow: 0 5px 0 #222 !important; color: #777 !important; cursor: not-allowed; transform: none; }
        
        #customPopup { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-200%); background: var(--gold); color: #000; padding: 15px 30px; border-radius: 50px; font-weight: 800; z-index: 1000; transition: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        #customPopup.show { transform: translateX(-50%) translateY(0); }
        
        .step { display: none; }
        .active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="customPopup">NOTIF</div>

    <div class="container">
        <h1>MIWA CASINO</h1>
        
        <div id="step-1" class="step active">
            <input type="text" id="phoneInput" placeholder="628xxxxxxxx">
            <button class="btn-gold" onclick="checkAccount()">ENTER LOBBY</button>
        </div>

        <div id="step-2" class="step">
            <div id="profileContent" class="profile-card">
                <h3 id="pName" style="margin:0 0 10px 0; color:var(--gold)">...</h3>
                <div style="display:flex; gap:10px;">
                    <div class="stat-box"><label>CHIPS</label><span id="pUang">0</span></div>
                    <div class="stat-box"><label>LIMIT</label><span id="pLimit">0</span></div>
                </div>
            </div>
            <button class="btn-gold" onclick="showStep(3)">PLAY SLOT</button>
        </div>

        <div id="step-3" class="step">
            <div class="slot-machine">
                <div class="reels-container">
                    <div id="strip1" class="reel-strip">
                        <div class="symbol">💰</div><div class="symbol">🍒</div><div class="symbol">💎</div>
                    </div>
                    <div id="strip2" class="reel-strip">
                        <div class="symbol">💰</div><div class="symbol">🍒</div><div class="symbol">💎</div>
                    </div>
                    <div id="strip3" class="reel-strip">
                        <div class="symbol">💰</div><div class="symbol">🍒</div><div class="symbol">💎</div>
                    </div>
                </div>
            </div>
            <input type="number" id="betInput" placeholder="Min 5,000">
            <button class="btn-gold" id="spinBtn" onclick="playGame()">SPIN SEKARANG</button>
            <p id="game-msg" style="font-weight: bold; margin-top: 15px; min-height: 20px; color: var(--gold);"></p>
        </div>
    </div>

    <script>
        const SECRET = "dimas_ganteng_123";
        const SYMBOLS = ['💰','🍒','💎','7️⃣','⭐','🔔','🍋','🍇'];
        let userData = {};
        let spinIntervals = [null, null, null];

        function showPopup(msg) {
            const p = document.getElementById('customPopup');
            p.innerText = msg; p.classList.add('show');
            setTimeout(() => p.classList.remove('show'), 3000);
        }

        async function checkAccount() {
            const num = document.getElementById('phoneInput').value;
            if(!num) return showPopup("MASUKKAN NOMOR!");
            try {
                const res = await fetch(`/api/slot-web`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nomor: num, secret: SECRET, type: 'check' })
                });
                const data = await res.json();
                if(data.status) {
                    userData = { nomor: num };
                    document.getElementById('pName').innerText = data.profile.name;
                    document.getElementById('pUang').innerText = "Rp " + data.profile.uang.toLocaleString();
                    document.getElementById('pLimit').innerText = data.profile.limit;
                    document.getElementById('profileContent').style.display = 'block';
                    showStep(2);
                } else { showPopup(data.msg); }
            } catch(e) { showPopup("SERVER ERROR"); }
        }

        function showStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step-'+n).classList.add('active');
        }

        // FUNGSI ANIMASI BARU (ULTRA SMOOTH)
        function startSmoothAnimate(reelIdx) {
            const strip = document.getElementById('strip' + (reelIdx + 1));
            let pos = 0;
            spinIntervals[reelIdx] = setInterval(() => {
                pos -= 20; // Kecepatan gerak
                if (pos <= -120) {
                    pos = 0;
                    // Ganti simbol atas dengan random
                    strip.children[0].innerText = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
                }
                strip.style.transform = `translateY(${pos}px)`;
            }, 20); // 50 FPS
        }

        async function playGame() {
            const bet = parseInt(document.getElementById('betInput').value);
            const btn = document.getElementById('spinBtn');
            const msgEl = document.getElementById('game-msg');

            if(!bet || bet < 5000) return showPopup("MIN 5,000!");

            btn.disabled = true;
            btn.innerText = "ROLLING...";
            msgEl.innerText = "";

            // Start Animasi
            startSmoothAnimate(0);
            startSmoothAnimate(1);
            startSmoothAnimate(2);

            try {
                const res = await fetch(`/api/slot-web`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nomor: userData.nomor, amount: bet, secret: SECRET })
                });
                const data = await res.json();

                if(data.status) {
                    // Stop Bergantian agar terasa nyata
                    [0, 1, 2].forEach(i => {
                        setTimeout(() => {
                            clearInterval(spinIntervals[i]);
                            const strip = document.getElementById('strip' + (i + 1));
                            strip.style.transform = "translateY(0)";
                            strip.children[0].innerText = data.reels[i]; // Set Hasil
                        }, 1200 + (i * 800));
                    });

                    setTimeout(() => {
                        msgEl.innerText = "HASIL: " + data.resultStatus;
                        btn.disabled = false;
                        btn.innerText = "SPIN SEKARANG";
                        checkAccount(); // Update saldo
                    }, 3500);
                } else {
                    throw new Error(data.msg);
                }
            } catch(e) {
                spinIntervals.forEach(itv => clearInterval(itv));
                btn.disabled = false; btn.innerText = "SPIN SEKARANG";
                showPopup(e.message);
            }
        }
    </script>
</body>
</html>
