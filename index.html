<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miwa Dashboard | Professional Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e11;
            --card: #151921;
            --input: #1f2632;
            --accent: #3d8bff;
            --accent-glow: rgba(61, 139, 255, 0.3);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --border: #2d3748;
            --success: #10b981;
            --error: #ef4444;
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: var(--card);
            width: 90%;
            max-width: 400px;
            border-radius: 32px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            text-align: center;
            position: relative;
        }

        h1 { font-weight: 800; letter-spacing: -1.5px; margin-bottom: 5px; font-size: 28px; }

        /* Profile Section */
        .profile-card {
            background: var(--input);
            border-radius: 24px;
            padding: 24px;
            margin-top: 10px;
            border: 1px solid var(--border);
            display: none;
            animation: slideUp 0.6s ease;
        }

        .profile-img {
            width: 75px; height: 75px;
            border-radius: 22px;
            border: 2px solid var(--accent);
            margin-bottom: 12px;
            object-fit: cover;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .balance-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .b-box {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .b-box label { display: block; font-size: 10px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; }
        .b-box span { display: block; color: var(--text-main); font-weight: 800; font-size: 14px; margin-top: 2px; }

        /* Input & Button */
        input {
            width: 100%; background: var(--input); border: 1px solid var(--border);
            padding: 16px 20px; border-radius: 18px; color: #fff;
            margin-bottom: 16px; outline: none; font-size: 15px;
        }

        input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }

        .btn {
            width: 100%; padding: 16px;
            background: var(--accent); color: white;
            border: none; border-radius: 18px;
            font-weight: 700; cursor: pointer;
            box-shadow: 0 8px 25px var(--accent-glow);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
        .btn:disabled { background: #2d3748; color: #64748b; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Slot Reels */
        .reels { display: flex; gap: 12px; justify-content: center; margin: 30px 0; }
        .reel {
            width: 85px; height: 85px; background: #000;
            border-radius: 20px; font-size: 40px; line-height: 85px;
            border: 1px solid var(--border);
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.8);
        }

        /* Custom Modal / Popup */
        #customPopup {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: var(--card); border: 1px solid var(--border);
            padding: 15px 25px; border-radius: 20px; z-index: 999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center;
            gap: 12px; opacity: 0; pointer-events: none;
        }

        #customPopup.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* Step & Animations */
        .step { display: none; }
        .active { display: block; animation: fadeIn 0.5s ease forwards; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .update-flash { animation: flash 0.5s ease; }
        @keyframes flash { 50% { color: var(--success); transform: scale(1.1); } }
    </style>
</head>
<body>

    <div id="customPopup">
        <div id="popIcon" style="font-size: 20px;">ℹ️</div>
        <div id="popMsg" style="font-size: 14px; font-weight: 600;">Pesan di sini</div>
    </div>

    <div class="container">
        <h1>MIWA</h1>
        
        <div id="step-1" class="step active">
            <p style="color: var(--text-dim); font-size: 14px; margin-bottom: 25px;">Sesi Aman & Terverifikasi</p>
            <input type="text" id="phoneInput" placeholder="Masukkan Nomor (628...)">
            <button class="btn" id="checkBtn" onclick="checkAccount()">Otorisasi Akun</button>
        </div>

        <div id="step-2" class="step">
            <div id="profileContent" class="profile-card">
                <img id="pImg" src="" class="profile-img">
                <h3 id="pName" style="margin:0; font-size: 18px;">...</h3>
                <div class="balance-info">
                    <div class="b-box"><label>SALDO</label><span id="pUang">Rp 0</span></div>
                    <div class="b-box"><label>LIMIT</label><span id="pLimit">0</span></div>
                </div>
            </div>
            
            <div id="countdownArea" style="margin-top:25px; font-size: 13px; color: var(--accent); font-weight: 600;">
                MEMUAT MODUL GAME... (<span id="cdText">5</span>)
            </div>

            <div id="gameList" style="display:none; margin-top: 25px;">
                <button class="btn" style="background: var(--input); color: white; display: flex; align-items: center; margin-bottom: 12px; box-shadow: none; border: 1px solid var(--border);" onclick="openGame()">
                    <span style="font-size: 20px; margin-right: 15px;">🎰</span> SLOT GENERAL
                </button>
                <p style="font-size: 11px; color: var(--text-dim); margin-top: 20px;">Mode Profesional Aktif</p>
            </div>
        </div>

        <div id="step-3" class="step">
            <p style="color: var(--accent); font-weight: 800; font-size: 11px; letter-spacing: 2px; margin-bottom: 10px;">MESIN SLOT AKTIF</p>
            <div class="reels">
                <div id="r1" class="reel">💎</div>
                <div id="r2" class="reel">💎</div>
                <div id="r3" class="reel">💎</div>
            </div>
            <input type="number" id="betInput" placeholder="Jumlah Taruhan (5k-50k)">
            <button class="btn" id="spinBtn" onclick="playGame()">PUTAR SEKARANG</button>
            <p id="game-msg" style="font-size: 12px; margin-top: 20px; color: var(--text-dim); font-weight: 700;"></p>
            <button onclick="logout()" style="background:none; border:none; color:var(--text-dim); font-size: 11px; cursor:pointer; margin-top: 15px;">Keluar Sesi</button>
        </div>
    </div>

    <script>
        const SECRET = "dimas_ganteng_123";
        const CD_HOURLY = 5 * 60 * 1000; 
        let userData = {};
        let userUang = 0;

        // --- CORE FUNCTIONS ---

        window.onload = () => {
            // Cek Auto Login
            const savedUser = localStorage.getItem('miwa_user');
            if(savedUser) {
                userData = JSON.parse(savedUser);
                loadProfileAuto();
            }

            // Cek Cooldown
            const lastSpin = localStorage.getItem('lastSpinTime');
            if (lastSpin) {
                const elapsed = Date.now() - parseInt(lastSpin);
                if (elapsed < CD_HOURLY) startGlobalCooldown(CD_HOURLY - elapsed);
            }
        };

        function showPopup(msg, type = 'info') {
            const p = document.getElementById('customPopup');
            const icon = document.getElementById('popIcon');
            document.getElementById('popMsg').innerText = msg;
            icon.innerText = type === 'error' ? '❌' : (type === 'success' ? '✅' : 'ℹ️');
            p.style.borderLeft = `5px solid ${type === 'error' ? 'var(--error)' : 'var(--success)'}`;
            p.classList.add('show');
            setTimeout(() => p.classList.remove('show'), 3000);
        }

        async function checkAccount() {
            const num = document.getElementById('phoneInput').value;
            const btn = document.getElementById('checkBtn');
            if(!num) return showPopup("Masukkan nomor WhatsApp!", "error");

            btn.disabled = true; 
            btn.innerText = "VERIFIKASI...";

            try {
                const res = await fetch(`/api/slot-web`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nomor: num, amount: 0, secret: SECRET, type: 'check' })
                });
                const data = await res.json();

                if(data.status || data.msg.includes("Minimal")) { 
                    userData = { nomor: num, profile: data.profile };
                    localStorage.setItem('miwa_user', JSON.stringify(userData)); // Simpan Sesi
                    loadProfileUI(data);
                } else {
                    showPopup("Akun tidak ditemukan!", "error");
                    btn.disabled = false;
                    btn.innerText = "OTORISASI AKUN";
                }
            } catch (e) { 
                showPopup("Koneksi Server Gagal!", "error");
                btn.disabled = false;
            }
        }

        function loadProfileAuto() {
            // Fungsi ini dipanggil kalau user sudah pernah login sebelumnya
            showStep(2);
            // Kamu bisa fetch ulang data saldo di sini jika mau lebih akurat
            document.getElementById('profileContent').style.display = 'block';
            document.getElementById('pName').innerText = userData.profile?.name || "User Miwa";
            userUang = userData.profile?.uang || 0;
            document.getElementById('pUang').innerText = "Rp " + userUang.toLocaleString();
            document.getElementById('pLimit').innerText = userData.profile?.limit || 0;
            document.getElementById('pImg').src = userData.profile?.img || "https://img1.pixhost.to/images/11480/682392173_dhikzxcloud.jpg";
            startMenuTimer();
        }

        function loadProfileUI(data) {
            showStep(2);
            userUang = data.profile?.uang || 0;
            document.getElementById('profileContent').style.display = 'block';
            document.getElementById('pName').innerText = data.profile?.name || "User Miwa";
            document.getElementById('pUang').innerText = "Rp " + userUang.toLocaleString();
            document.getElementById('pLimit').innerText = data.profile?.limit || 0;
            document.getElementById('pImg').src = data.profile?.img || "https://img1.pixhost.to/images/11480/682392173_dhikzxcloud.jpg";
            startMenuTimer();
        }

        function startMenuTimer() {
            let cd = 5;
            const itv = setInterval(() => {
                cd--;
                document.getElementById('cdText').innerText = cd;
                if(cd <= 0) {
                    clearInterval(itv);
                    document.getElementById('countdownArea').style.display = 'none';
                    document.getElementById('gameList').style.display = 'block';
                }
            }, 1000);
        }

        function showStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step-'+n).classList.add('active');
        }

        function openGame() { showStep(3); }

        async function playGame() {
            const betInput = document.getElementById('betInput');
            const bet = Math.abs(parseInt(betInput.value)); // Anti Spam Minus
            const btn = document.getElementById('spinBtn');
            const reels = [document.getElementById('r1'), document.getElementById('r2'), document.getElementById('r3')];

            if(!bet || bet < 5000) return showPopup("Minimal taruhan Rp 5.000", "error");
            if(bet > userUang) return showPopup("Saldo Anda tidak cukup!", "error");
            
            btn.disabled = true;
            document.getElementById('game-msg').innerText = "MENUNGGU HASIL...";
            
            // Animasi Putar Tanpa Henti
            const anims = reels.map(r => setInterval(() => {
                r.innerText = ['🍎','🍇','🍒','💎','🍋','🔔'][Math.floor(Math.random()*6)];
            }, 70));

            try {
                const res = await fetch(`/api/slot-web`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nomor: userData.nomor, amount: bet, secret: SECRET })
                });
                const data = await res.json();

                if(data.status) {
                    // BERHENTI SATU PER SATU (Realistic)
                    setTimeout(() => { clearInterval(anims[0]); reels[0].innerText = data.reels[0]; }, 1000);
                    setTimeout(() => { clearInterval(anims[1]); reels[1].innerText = data.reels[1]; }, 1800);
                    setTimeout(() => { 
                        clearInterval(anims[2]); 
                        reels[2].innerText = data.reels[2];
                        finishGame(data);
                    }, 2600);
                } else {
                    anims.forEach(a => clearInterval(a));
                    showPopup(data.msg, "error");
                    btn.disabled = false;
                }
            } catch (e) { 
                anims.forEach(a => clearInterval(a));
                showPopup("Koneksi Putus!", "error");
                btn.disabled = false; 
            }
        }

        function finishGame(data) {
            const msgEl = document.getElementById('game-msg');
            msgEl.innerText = "RESULT: " + data.resultStatus;
            
            if(data.currentUang !== undefined) {
                userUang = data.currentUang;
                const saldoEl = document.getElementById('pUang');
                saldoEl.innerText = "Rp " + userUang.toLocaleString();
                saldoEl.classList.add('update-flash');
                setTimeout(() => saldoEl.classList.remove('update-flash'), 600);
            }

            localStorage.setItem('lastSpinTime', Date.now().toString());
            startGlobalCooldown(CD_HOURLY);
            
            if(data.resultStatus.toLowerCase().includes('win')) showPopup("JACKPOT! Saldo bertambah.", "success");
        }

        function startGlobalCooldown(ms) {
            const btn = document.getElementById('spinBtn');
            showStep(3); btn.disabled = true;
            const itv = setInterval(() => {
                ms -= 1000;
                let min = Math.floor(ms / 60000), sec = Math.floor((ms % 60000) / 1000);
                btn.innerText = `COOLDOWN (${min}:${sec < 10 ? '0'+sec : sec})`;
                if(ms <= 0) {
                    clearInterval(itv);
                    btn.disabled = false; btn.innerText = "PUTAR SEKARANG";
                    localStorage.removeItem('lastSpinTime');
                }
            }, 1000);
        }

        function logout() {
            localStorage.removeItem('miwa_user');
            location.reload();
        }
    </script>
</body>
</html>
