<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>MIWA CASINO | PREMIUM SLOT</title>

<link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Plus Jakarta Sans',sans-serif;
background:#0f0f12;
color:white;
overflow-x:hidden;
}

.container{
width:100%;
min-height:100vh;
padding:20px;
display:flex;
justify-content:center;
align-items:center;
}

.card{
width:100%;
max-width:430px;
background:#17171c;
border:1px solid #2c2c33;
border-radius:24px;
padding:24px;
box-shadow:0 0 40px rgba(0,0,0,.4);
}

.logo{
font-family:'Goldman',sans-serif;
font-size:32px;
text-align:center;
margin-bottom:10px;
color:#ffd700;
}

.subtitle{
text-align:center;
color:#aaa;
font-size:14px;
margin-bottom:25px;
}

.input-group{
margin-bottom:18px;
}

.input-group label{
display:block;
margin-bottom:8px;
font-size:14px;
font-weight:600;
}

.input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:14px;
background:#24242d;
color:white;
font-size:14px;
}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:#ffd700;
color:black;
font-weight:800;
font-size:15px;
cursor:pointer;
transition:.2s;
}

.btn:hover{
transform:translateY(-2px);
}

.profile{
background:#212129;
padding:16px;
border-radius:18px;
margin-bottom:20px;
}

.profile h3{
font-size:17px;
margin-bottom:10px;
}

.profile p{
font-size:14px;
margin:4px 0;
color:#ccc;
}

.slot-machine{
margin-top:20px;
}

.reels{
display:flex;
justify-content:center;
gap:12px;
margin:25px 0;
}

.reel{
width:90px;
height:90px;
background:#222;
border-radius:18px;
display:flex;
justify-content:center;
align-items:center;
font-size:45px;
border:2px solid #333;
transition:.2s;
}

.spin{
animation:spin .12s linear infinite;
}

@keyframes spin{
0%{
transform:translateY(-5px);
}
50%{
transform:translateY(5px);
}
100%{
transform:translateY(-5px);
}
}

.bet-box{
display:flex;
gap:10px;
margin-top:15px;
}

.bet-input{
flex:1;
padding:14px;
border:none;
outline:none;
background:#24242d;
color:white;
border-radius:14px;
}

.message{
margin-top:20px;
padding:14px;
border-radius:14px;
text-align:center;
font-weight:700;
display:none;
}

.success{
background:#113d21;
color:#5cff9d;
}

.error{
background:#3d1111;
color:#ff7c7c;
}

.loading{
text-align:center;
padding:30px;
font-size:15px;
color:#aaa;
}

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.7);
display:none;
justify-content:center;
align-items:center;
z-index:999;
padding:20px;
}

.popup-content{
width:100%;
max-width:350px;
background:#1d1d24;
border-radius:20px;
padding:24px;
text-align:center;
}

.popup-content h2{
margin-bottom:10px;
}

.popup-content p{
color:#bbb;
font-size:14px;
margin-bottom:20px;
}

.hidden{
display:none;
}
</style>
</head>
<body>

<div class="container">
<div id="app"></div>
</div>

<div class="popup" id="customPopup">
<div class="popup-content">
<h2 id="popupTitle">Info</h2>
<p id="popupMessage">Message</p>
<button class="btn" onclick="closePopup()">OK</button>
</div>
</div>

<script>

const SECRET = "MIWA_SECURE_KEY"
const STORAGE_KEY = "MIWA_API"

let API_URL = localStorage.getItem(STORAGE_KEY) || ""
let userData = {
ip: null,
profile: null
}

const app = document.getElementById('app')

function showPopup(title, message){
document.getElementById('popupTitle').innerText = title
document.getElementById('popupMessage').innerText = message
document.getElementById('customPopup').style.display = 'flex'
}

function closePopup(){
document.getElementById('customPopup').style.display = 'none'
}

function renderSetupPage(){
app.innerHTML = `
<div class="card">
<div class="logo">MIWA CASINO</div>
<div class="subtitle">
Hubungkan API server kamu terlebih dahulu
</div>

<div class="input-group">
<label>API URL</label>
<input 
type="text" 
class="input" 
id="apiInput"
placeholder="https://domain.com/api"
value="${API_URL}"
>
</div>

<button class="btn" onclick="saveAPI()">
Hubungkan API
</button>
</div>
`
}

function saveAPI(){

const val = document.getElementById('apiInput').value.trim()

if(!val){
return showPopup('Gagal','API URL wajib diisi')
}

if(
!val.startsWith('http://') &&
!val.startsWith('https://')
){
return showPopup('Invalid','URL harus diawali http:// atau https://')
}

API_URL = val

localStorage.setItem(STORAGE_KEY,val)

startApp()
}

async function startApp(){

if(!API_URL){
return renderSetupPage()
}

app.innerHTML = `
<div class="loading">
Menghubungkan server...
</div>
`

try{

const ipReq = await fetch('https://api.ipify.org?format=json')
const ipData = await ipReq.json()

userData.ip = ipData.ip

let profile = null

try{

const res = await fetch(API_URL,{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({
type:'checkIP',
ip:userData.ip,
secret:SECRET
})
})

profile = await res.json()

}catch{

profile = {
username:'Guest User',
balance:100000,
vip:'Bronze'
}

}

userData.profile = {
username: profile.username || 'Guest User',
balance: profile.balance || 100000,
vip: profile.vip || 'Bronze'
}

renderSlotPage()

}catch(err){

console.log(err)

showPopup(
'Error',
'Gagal menghubungkan server/API'
)

renderSetupPage()

}
}

function renderProfile(){

return `
<div class="profile">
<h3>${userData.profile.username}</h3>

<p>💰 Saldo: Rp ${Number(userData.profile.balance).toLocaleString('id-ID')}</p>

<p>👑 VIP: ${userData.profile.vip}</p>

<p>🌐 IP: ${userData.ip}</p>
</div>
`
}

function renderSlotPage(){

app.innerHTML = `
<div class="card">

<div class="logo">
MIWA SLOT
</div>

${renderProfile()}

<div class="slot-machine">

<div class="reels">
<div class="reel" id="reel1">🍒</div>
<div class="reel" id="reel2">💎</div>
<div class="reel" id="reel3">7️⃣</div>
</div>

<div class="bet-box">
<input 
type="number" 
id="betInput"
class="bet-input"
placeholder="Masukkan bet"
value="1000"
>
</div>

<button 
class="btn"
id="spinBtn"
onclick="playGame()"
>
SPIN SEKARANG
</button>

<div class="message" id="messageBox"></div>

</div>
</div>
`
}

function setMessage(text,type='success'){

const box = document.getElementById('messageBox')

box.style.display = 'block'
box.className = `message ${type}`
box.innerHTML = text

}

async function playGame(){

const bet = Number(
document.getElementById('betInput').value
)

if(!bet || bet <= 0){
return showPopup(
'Invalid',
'Bet tidak valid'
)
}

if(bet > userData.profile.balance){
return showPopup(
'Saldo Kurang',
'Saldo kamu tidak mencukupi'
)
}

const btn = document.getElementById('spinBtn')

btn.disabled = true
btn.innerText = 'SPINNING...'

const reel1 = document.getElementById('reel1')
const reel2 = document.getElementById('reel2')
const reel3 = document.getElementById('reel3')

reel1.classList.add('spin')
reel2.classList.add('spin')
reel3.classList.add('spin')

const emoji = ['🍒','💎','7️⃣','🍋','🔥','🪙']

function randomEmoji(){
return emoji[Math.floor(Math.random()*emoji.length)]
}

const interval = setInterval(()=>{

reel1.innerText = randomEmoji()
reel2.innerText = randomEmoji()
reel3.innerText = randomEmoji()

},100)

let result = null

try{

const req = await fetch(API_URL,{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({
type:'spin',
ip:userData.ip,
amount:bet,
secret:SECRET
})
})

result = await req.json()

}catch{

const isWin = Math.random() > 0.5

result = {
win: isWin,
amount: isWin ? bet * 2 : 0,
balance: isWin
? userData.profile.balance + bet
: userData.profile.balance - bet,
reels: isWin
? ['💎','💎','💎']
: ['🍒','🔥','🍋']
}

}

setTimeout(()=>{

clearInterval(interval)

reel1.classList.remove('spin')
reel2.classList.remove('spin')
reel3.classList.remove('spin')

reel1.innerText = result.reels[0]
reel2.innerText = result.reels[1]
reel3.innerText = result.reels[2]

userData.profile.balance = result.balance

if(result.win){

setMessage(
`🎉 Kamu menang Rp ${Number(result.amount).toLocaleString('id-ID')}`,
'success'
)

}else{

setMessage(
`😢 Kamu kalah Rp ${Number(bet).toLocaleString('id-ID')}`,
'error'
)

}

renderSlotBalance()

btn.disabled = false
btn.innerText = 'SPIN SEKARANG'

},2000)

}

function renderSlotBalance(){

const profile = document.querySelector('.profile')

profile.innerHTML = `
<h3>${userData.profile.username}</h3>

<p>💰 Saldo: Rp ${Number(userData.profile.balance).toLocaleString('id-ID')}</p>

<p>👑 VIP: ${userData.profile.vip}</p>

<p>🌐 IP: ${userData.ip}</p>
`
}

startApp()

</script>
</body>
</html>
