<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIWA CASINO | Premium Slot</title>

<link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

:root{
--bg-dark:#080808;
--card-dark:#121212;
--accent-blue:#3d85ff;
--gold:#ffcc00;
--gold-dark:#b8860b;
--text-main:#e0e0e0;
--text-dim:#777;
}

*{
box-sizing:border-box;
}

body{
background:var(--bg-dark);
color:var(--text-main);
font-family:'Plus Jakarta Sans',sans-serif;
margin:0;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
}

body.casino-mode{
background:radial-gradient(circle at center,#1a0f00 0%,#050505 100%);
}

#main-loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:var(--bg-dark);
z-index:9999;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
transition:.5s;
}

.liquid-ring{
width:60px;
height:60px;
border-radius:50%;
border:3px solid transparent;
border-top-color:var(--gold);
animation:rotate 1s linear infinite;
}

@keyframes rotate{
to{
transform:rotate(360deg);
}
}

.container{
width:92%;
max-width:380px;
opacity:0;
transition:.8s;
}

#customPopup{
position:fixed;
bottom:30px;
left:50%;
transform:translateX(-50%) translateY(150%);
background:#fff;
color:#000;
padding:10px 20px;
border-radius:50px;
font-weight:800;
z-index:10000;
transition:.3s;
}

#customPopup.show{
transform:translateX(-50%) translateY(0);
}

.modern-card{
background:var(--card-dark);
border-radius:40px;
padding:40px 30px;
box-shadow:0 30px 60px rgba(0,0,0,.8);
border:1px solid rgba(255,255,255,.03);
text-align:center;
}

.btn-gold{
width:100%;
padding:20px;
border-radius:25px;
border:none;
background:linear-gradient(135deg,var(--gold),var(--gold-dark));
color:#000;
font-family:'Goldman';
font-weight:800;
cursor:pointer;
}

.btn-blue{
width:100%;
padding:18px;
border-radius:20px;
border:1px solid #333;
background:#1a1a1a;
color:var(--accent-blue);
font-weight:800;
cursor:pointer;
font-size:14px;
}

.api-input{
width:100%;
background:#181818;
border:1px solid #222;
border-radius:20px;
padding:18px;
color:white;
outline:none;
margin-bottom:18px;
font-size:13px;
}

.casino-ui{
background:#0a0a0a;
border:3px solid var(--gold);
border-radius:45px;
padding:30px 20px;
box-shadow:0 0 50px rgba(0,0,0,1);
position:relative;
}

.reel-strip{
display:flex;
flex-direction:column;
align-items:center;
position:absolute;
width:100%;
}

.slot-item{
height:120px;
min-height:120px;
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
}

@keyframes spin-loop{
from{
transform:translateY(0);
}
to{
transform:translateY(-1200px);
}
}

.spinning{
animation:spin-loop .2s linear infinite;
}

.hide-controls{
opacity:.4;
pointer-events:none;
}

.slot-grid{
display:flex;
gap:10px;
margin-bottom:20px;
}

.slot-col{
flex:1;
position:relative;
overflow:hidden;
height:120px;
background:#111;
border-radius:20px;
border:1px solid #222;
}

#betInput{
width:100%;
padding:18px;
border-radius:20px;
border:none;
outline:none;
background:#181818;
color:white;
margin-bottom:15px;
text-align:center;
font-size:16px;
}

.game-grid{
display:grid;
gap:15px;
margin-top:15px;
}

.profile-box{
background:#181818;
padding:20px;
border-radius:25px;
margin-bottom:25px;
border:1px solid #222;
text-align:left;
}

.profile-top{
display:flex;
align-items:center;
gap:15px;
}

.profile-top img{
width:65px;
height:65px;
border-radius:50%;
object-fit:cover;
border:2px solid var(--gold);
}

</style>
</head>
<body>

<div id="main-loader">

<div class="liquid-ring"></div>

<p style="
font-family:'Goldman';
color:var(--gold);
margin-top:20px;
font-size:10px;
letter-spacing:3px;
">
AUTHENTICATING...
</p>

</div>

<div id="customPopup">Alert</div>

<div class="container" id="app-viewport"></div>

<script>

const SECRET = "dimas_ganteng_123"

const STORAGE_KEY = "MIWA_CUSTOM_API"

let API_URL =
localStorage.getItem(STORAGE_KEY) ||
"https://scaling-channel-impose.ngrok-free.dev/api/slot-web"

const SYMS = [
'🍇','🍉','🍋','🍌','🍎',
'🍑','🍒','🫐','🥥','🥑'
]

let userData = {
ip:'',
profile:{}
}

function showPopup(msg){

const p =
document.getElementById('customPopup')

p.innerText = msg

p.classList.add('show')

setTimeout(()=>{
p.classList.remove('show')
},2500)

}

function renderSetupPage(){

document.body.classList.remove('casino-mode')

document.getElementById('app-viewport').innerHTML = `
<div class="modern-card">

<h1 style="
font-family:'Goldman';
font-size:28px;
margin-bottom:10px;
color:var(--gold);
">
MIWA CASINO
</h1>

<p style="
font-size:13px;
color:#888;
margin-bottom:25px;
">
Hubungkan API server slot kamu
</p>

<input
type="text"
id="apiInput"
class="api-input"
placeholder="https://domain.com/api"
value="${API_URL}"
>

<button class="btn-gold" onclick="saveAPI()">
CONNECT API
</button>

</div>
`

document.getElementById('app-viewport').style.opacity = '1'

}

function saveAPI(){

const val =
document.getElementById('apiInput').value.trim()

if(!val)
return showPopup("URL API wajib diisi")

if(
!val.startsWith('http://') &&
!val.startsWith('https://')
)
return showPopup("URL tidak valid")

API_URL = val

localStorage.setItem(STORAGE_KEY,val)

showPopup("API berhasil disimpan")

startApp()

}

function renderDashboard(){

document.body.classList.remove('casino-mode')

document.getElementById('app-viewport').innerHTML = `
<div class="modern-card">

<h1 style="
font-family:'Goldman';
font-size:28px;
margin-bottom:10px;
color:var(--gold);
">
MIWA CASINO
</h1>

<p style="
font-size:13px;
color:#888;
margin-bottom:25px;
">
Welcome back, ${userData.profile.name || 'Guest'}
</p>

<div class="profile-box">

<div class="profile-top">

<img
src="${userData.profile.img || 'https://i.ibb.co/4pDNDk1/avatar.png'}"
>

<div>

<div style="
font-size:17px;
font-weight:800;
">
${userData.profile.name || 'Unknown User'}
</div>

<div style="
font-size:12px;
color:#888;
margin-top:4px;
">
IP: ${userData.ip}
</div>

</div>

</div>

<div style="
margin-top:18px;
padding-top:18px;
border-top:1px solid #222;
">

<div style="
font-size:13px;
color:#888;
">
SALDO
</div>

<div style="
font-size:28px;
font-family:'Goldman';
margin-top:8px;
color:var(--gold);
">
Rp ${Number(userData.profile.uang || 0).toLocaleString('id-ID')}
</div>

</div>

</div>

<div style="
text-align:left;
font-size:13px;
font-weight:700;
color:#888;
margin-bottom:12px;
">
PILIH GAME
</div>

<div class="game-grid">

<button
class="btn-gold"
onclick="openSlotGame()"
>
🎰 SLOT 3x3
</button>

<button
class="btn-blue"
onclick="showPopup('Roulette Coming Soon')"
>
🎡 ROULETTE
</button>

<button
class="btn-blue"
onclick="showPopup('Crasher Coming Soon')"
>
📈 CRASHER
</button>

<button
class="btn-blue"
onclick="showPopup('Blackjack Coming Soon')"
>
🃏 BLACKJACK
</button>

</div>

<button
class="btn-blue"
style="margin-top:20px"
onclick="changeAPI()"
>
CHANGE API URL
</button>

</div>
`

document.getElementById('app-viewport').style.opacity = '1'

}

function openSlotGame(){

document.body.classList.add('casino-mode')

document.getElementById('app-viewport').innerHTML = `
<div class="casino-ui">

<h2 style="
font-family:'Goldman';
color:var(--gold);
margin-top:0;
text-align:center;
">
MIWA SLOT
</h2>

<div style="
background:#111;
padding:15px;
border-radius:20px;
margin-bottom:20px;
border:1px solid #222;
text-align:center;
">

<div style="
font-size:13px;
color:#888;
">
SALDO
</div>

<div id="displayMoney" style="
font-size:25px;
font-family:'Goldman';
margin-top:8px;
color:white;
">
Rp ${userData.profile.uang.toLocaleString('id-ID')}
</div>

</div>

<div class="slot-grid">

<div class="slot-col">
<div class="reel-strip" id="strip1"></div>
</div>

<div class="slot-col">
<div class="reel-strip" id="strip2"></div>
</div>

<div class="slot-col">
<div class="reel-strip" id="strip3"></div>
</div>

</div>

<div id="ui-controls">

<input
type="number"
id="betInput"
placeholder="Minimal bet 5000"
value="5000"
>

<button
class="btn-gold"
id="spinBtn"
onclick="playGame()"
>
SPIN MACHINE
</button>

<button
class="btn-blue"
style="margin-top:12px"
onclick="renderDashboard()"
>
← BACK TO DASHBOARD
</button>

<button
class="btn-blue"
style="margin-top:12px"
onclick="changeAPI()"
>
CHANGE API URL
</button>

</div>

</div>
`

document.getElementById('app-viewport').style.opacity = '1'

initReels()

}

function changeAPI(){

localStorage.removeItem(STORAGE_KEY)

renderSetupPage()

}

async function startApp(){

try{

const resIp =
await fetch('https://api.ipify.org?format=json')

const dataIp =
await resIp.json()

userData.ip = dataIp.ip

const resAuth =
await fetch(API_URL,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
type:'checkIP',
ip:userData.ip,
secret:SECRET
})
})

const auth =
await resAuth.json()

document.getElementById('main-loader').style.opacity = '0'

setTimeout(()=>{

document.getElementById('main-loader').style.display = 'none'

document.getElementById('app-viewport').style.opacity = '1'

if(auth.status){

userData.profile = auth.profile

renderDashboard()

}else{

renderSetupPage()

}

},1000)

}catch(e){

console.error(e)

document.getElementById('main-loader').style.display = 'none'

renderSetupPage()

showPopup("API gagal terhubung")

}

}

function initReels(){

for(let i=1;i<=3;i++){

const strip =
document.getElementById('strip'+i)

strip.innerHTML = ''

for(let j=0;j<15;j++){

const item =
document.createElement('div')

item.className = 'slot-item'

item.innerText =
SYMS[Math.floor(Math.random()*SYMS.length)]

strip.appendChild(item)

}

}

}

let cooldownTimer = null

async function playGame(){

const bet =
parseInt(
document.getElementById('betInput').value
)

const spinBtn =
document.getElementById('spinBtn')

const controls =
document.getElementById('ui-controls')

if(spinBtn.classList.contains('cooldown-active'))
return

if(!bet || bet < 5000)
return showPopup("MIN BET Rp 5.000")

if(userData.profile.uang < bet)
return showPopup("SALDO TIDAK CUKUP!")

spinBtn.disabled = true

try{

const res =
await fetch(API_URL,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
ip:userData.ip,
amount:bet,
secret:SECRET
})
})

const data =
await res.json()

if(!data.status){

spinBtn.disabled = false

return showPopup(data.msg || "Spin gagal")

}

controls.classList.add('hide-controls')

for(let i=1;i<=3;i++){

document
.getElementById('strip'+i)
.classList.add('spinning')

}

;[0,1,2].forEach(i=>{

setTimeout(()=>{

const strip =
document.getElementById('strip'+(i+1))

strip.classList.remove('spinning')

const first =
strip.querySelector('.slot-item')

if(first)
first.innerText = data.reels[i]

},1200 + (i*800))

})

setTimeout(()=>{

userData.profile = data.profile

document.getElementById('displayMoney').innerText =
"Rp " +
data.profile.uang.toLocaleString('id-ID')

controls.classList.remove('hide-controls')

startCooldownButton(60)

setTimeout(()=>{
showPopup(data.resultStatus || "Spin selesai")
},300)

},3800)

}catch(e){

console.error(e)

controls.classList.remove('hide-controls')

spinBtn.disabled = false

showPopup("Koneksi Error!")

}

}

function startCooldownButton(seconds){

const spinBtn =
document.getElementById('spinBtn')

if(cooldownTimer)
clearInterval(cooldownTimer)

spinBtn.disabled = true

spinBtn.classList.add('cooldown-active')

let remaining = seconds

cooldownTimer = setInterval(()=>{

let m =
Math.floor(remaining/60)

let s =
remaining%60

spinBtn.innerText =
`WAIT (${m}:${s < 10 ? '0'+s : s})`

remaining--

if(remaining < 0){

clearInterval(cooldownTimer)

spinBtn.disabled = false

spinBtn.classList.remove('cooldown-active')

spinBtn.innerText = "SPIN MACHINE"

}

},1000)

}

startApp()

</script>
</body>
</html>
