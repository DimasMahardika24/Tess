<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miwa Dashboard | Professional Edition</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
--bg:#0b0e11;
--card:#151921;
--input:#1f2632;
--accent:#3d8bff;
--accent-glow:rgba(61,139,255,0.3);
--text-main:#fff;
--text-dim:#94a3b8;
--border:#2d3748;
--success:#10b981;
}

*{box-sizing:border-box;transition:.3s}

body{
background:var(--bg);
color:#fff;
font-family:'Plus Jakarta Sans',sans-serif;
display:flex;justify-content:center;align-items:center;
min-height:100vh;margin:0;
}

.container{
background:var(--card);
width:95%;max-width:400px;
border-radius:30px;
padding:35px 20px;
border:1px solid var(--border);
text-align:center;
}

.profile-card{
background:var(--input);
border-radius:20px;
padding:15px;
margin-top:10px;
display:none;
}

.profile-img{
width:65px;height:65px;
border-radius:15px;
border:2px solid var(--accent);
margin-bottom:10px;
}

.balance-info{
display:flex;gap:10px;margin-top:15px;
}

.b-box{
flex:1;
background:#0003;
padding:12px;
border-radius:12px;
}

.b-box label{
font-size:10px;color:var(--text-dim);
}

.b-box span{
display:block;
font-weight:800;
font-size:18px;
margin-top:4px;
color:var(--success);
}

#pLimit{color:var(--accent)}

input{
width:100%;
background:var(--input);
border:1px solid var(--border);
padding:14px;
border-radius:14px;
color:#fff;
margin-bottom:12px;
}

.btn{
width:100%;
padding:14px;
background:var(--accent);
border:none;
border-radius:14px;
font-weight:700;
cursor:pointer;
}

.reels{
display:flex;
gap:10px;
justify-content:center;
margin:20px 0;
}

.reel{
width:80px;height:80px;
background:#000;
border-radius:15px;
font-size:35px;
line-height:80px;
}

.step{display:none}
.active{display:block}

</style>
</head>

<body>

<div class="container">

<h2>MIWA</h2>

<!-- STEP 1 -->
<div id="step-1" class="step active">
<input id="phoneInput" placeholder="628xxx">
<button class="btn" onclick="checkAccount()">LOGIN</button>
</div>

<!-- STEP 2 -->
<div id="step-2" class="step">

<div id="profileContent" class="profile-card">
<img id="pImg" class="profile-img">
<h3 id="pName"></h3>

<div class="balance-info">
<div class="b-box">
<label>UANG</label>
<span id="pUang">Rp 0</span>
</div>

<div class="b-box">
<label>LIMIT</label>
<span id="pLimit">0</span>
</div>
</div>

</div>

<button class="btn" onclick="openGame()">MAIN</button>

</div>

<!-- STEP 3 -->
<div id="step-3" class="step">

<div class="reels">
<div id="r1" class="reel">💎</div>
<div id="r2" class="reel">💎</div>
<div id="r3" class="reel">💎</div>
</div>

<input id="betInput" type="number" placeholder="Bet">

<button id="spinBtn" class="btn" onclick="playGame()">SPIN</button>

<p id="game-msg"></p>

</div>

</div>

<script>

const SECRET="dimas_ganteng_123";
const CD_HOURLY=5*60*1000;

let userData={}
let userUang=0
let userLimit=0

function showStep(n){
document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'))
document.getElementById('step-'+n).classList.add('active')
}

async function checkAccount(){
let num=document.getElementById('phoneInput').value

let res=await fetch('/api/slot-web',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({nomor:num,amount:0,secret:SECRET,type:'check'})
})

let data=await res.json()

if(data.status){
userData={nomor:num,profile:data.profile}
updateProfileDisplay(data.profile)
showStep(2)
}else{
alert('Akun tidak ada')
}
}

function updateProfileDisplay(p){
document.getElementById('profileContent').style.display='block'

userUang=p?.uang||0
userLimit=p?.limit||0

document.getElementById('pName').innerText=p?.name||'User'
document.getElementById('pUang').innerText='Rp '+userUang.toLocaleString()
document.getElementById('pLimit').innerText=userLimit.toLocaleString()
document.getElementById('pImg').src=p?.img||''
}

function openGame(){
showStep(3)
checkCooldown()
}

async function playGame(){

if(userLimit<=0) return alert('Limit habis!')

let bet=parseInt(document.getElementById('betInput').value)

if(bet>userUang) return alert('Saldo kurang')

let reels=[r1,r2,r3]

let anims=reels.map(r=>setInterval(()=>{
r.innerText=['🍎','🍇','💎','🍒'][Math.floor(Math.random()*4)]
},80))

let res=await fetch('/api/slot-web',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({nomor:userData.nomor,amount:bet,secret:SECRET})
})

let data=await res.json()

setTimeout(()=>{clearInterval(anims[0]);r1.innerText=data.reels[0]},1000)
setTimeout(()=>{clearInterval(anims[1]);r2.innerText=data.reels[1]},1600)
setTimeout(()=>{
clearInterval(anims[2])
r3.innerText=data.reels[2]
finishGame(data)
},2200)

}

function finishGame(data){

document.getElementById('game-msg').innerText='RESULT: '+data.resultStatus

if(data.currentUang!==undefined){
userUang=data.currentUang
document.getElementById('pUang').innerText='Rp '+userUang.toLocaleString()
}

if(data.currentLimit!==undefined){
userLimit=data.currentLimit
document.getElementById('pLimit').innerText=userLimit.toLocaleString()
}

localStorage.setItem('lastSpinTime',Date.now())
startGlobalCooldown(CD_HOURLY)

if(data.resultStatus.toLowerCase().includes('win')){
alert('JACKPOT!')
}

}

function checkCooldown(){
let last=localStorage.getItem('lastSpinTime')
if(!last) return
let sisa=CD_HOURLY-(Date.now()-last)
if(sisa>0) startGlobalCooldown(sisa)
}

function startGlobalCooldown(ms){
let btn=document.getElementById('spinBtn')
btn.disabled=true

let itv=setInterval(()=>{
ms-=1000
let m=Math.floor(ms/60000)
let s=Math.floor((ms%60000)/1000)

btn.innerText=`WAIT ${m}:${s<10?'0'+s:s}`

if(ms<=0){
clearInterval(itv)
btn.disabled=false
btn.innerText='SPIN'
localStorage.removeItem('lastSpinTime')
}
},1000)
}

</script>

</body>
</html>
