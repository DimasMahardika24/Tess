<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIWA APP | Premium Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --soft-dark: #121212;
            --card-modern: #1e1e1e;
            --accent-blue: #3d85ff;
            --gold: #ffcc00;
            --gold-dark: #b8860b;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }

        * { box-sizing: border-box; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            background-color: var(--soft-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* TEMA DINAMIS */
        body.casino-mode {
            background: radial-gradient(circle at center, #1a0f00 0%, #050505 100%);
        }

        .container {
            width: 90%;
            max-width: 400px;
            position: relative;
        }

        /* STEP 1 & 2: MODERN SOFT DARK */
        .modern-card {
            background: var(--card-modern);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* PROFILE DETAIL (STEP 2) */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }

        .profile-avatar-wrapper {
            position: relative;
            padding: 5px;
            background: linear-gradient(45deg, var(--accent-blue), #8000ff);
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid var(--card-modern);
            object-fit: cover;
        }

        .online-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 18px;
            height: 18px;
            background: #00ff88;
            border: 3px solid var(--card-modern);
            border-radius: 50%;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .info-item {
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 20px;
            text-align: center;
        }

        .info-item label { font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 5px; }
        .info-item span { font-weight: 700; font-size: 14px; }

        /* BUTTONS */
        .btn-modern {
            width: 100%;
            padding: 16px;
            border-radius: 18px;
            border: none;
            background: var(--accent-blue);
            color: white;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-casino-entry {
            margin-top: 20px;
            background: linear-gradient(90deg, #b8860b, #ffcc00);
            color: #000;
            font-family: 'Goldman';
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(184, 134, 11, 0.3);
        }

        /* STEP 3: CASINO THEME */
        .casino-ui {
            background: #111;
            border: 3px solid var(--gold);
            border-radius: 40px;
            padding: 30px 20px;
            box-shadow: 0 0 40px rgba(255,204,0,0.2);
            display: none;
        }

        .slot-window {
            height: 140px;
            background: #000;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
            border: 2px solid #333;
            margin-bottom: 25px;
        }

        .reel-column {
            width: 80px;
            display: flex;
            flex-direction: column;
            transition: transform 0.1s linear;
        }

        .slot-item {
            height: 120px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        /* HIDE UI SAAT SPIN */
        .is-spinning .hide-on-spin {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        #customPopup {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-200%);
            background: var(--gold); color: #000; padding: 12px 25px;
            border-radius: 50px; font-weight: 800; z-index: 9999;
        }
        #customPopup.show { transform: translateX(-50%) translateY(0); }

        .step { display: none; }
        .step.active { display: block; animation: slideUp 0.6s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body id="mainBody">

    <div id="customPopup">NOTIF</div>

    <div class="container">
        <div id="step-1" class="step active">
            <div class="modern-card">
                <h2 style="margin-top:0">Welcome back</h2>
                <p style="color:var(--text-dim); font-size:14px">Masukkan nomor WhatsApp anda untuk memulai sesi.</p>
                <input type="text" id="phoneInput" style="width:100%; background:#252525; border:1px solid #333; padding:15px; border-radius:15px; color:#fff; margin-bottom:20px" placeholder="628xxx">
                <button class="btn-modern" id="loginBtn" onclick="checkAccount()">Continue</button>
            </div>
        </div>

        <div id="step-2" class="step">
            <div class="modern-card">
                <div class="profile-header">
                    <div class="profile-avatar-wrapper">
                        <img id="pImg" src="" class="profile-img">
                        <div class="online-badge"></div>
                    </div>
                    <h2 id="pName" style="margin:5px 0">...</h2>
                    <span style="color:var(--accent-blue); font-size:12px; font-weight:700">PREMIUM MEMBER</span>
                </div>

                <div class="info-grid">
                    <div class="info-item">
                        <label>BALANCE</label>
                        <span id="pUang" style="color:#00ff88">Rp 0</span>
                    </div>
                    <div class="info-item">
                        <label>LIMIT</label>
                        <span id="pLimit">0</span>
                    </div>
                </div>

                <button class="btn-modern btn-casino-entry" onclick="goToCasino()">🎰 OPEN CASINO ROOM</button>
                <p onclick="location.reload()" style="text-align:center; font-size:12px; color:var(--text-dim); margin-top:20px; cursor:pointer">Logout Account</p>
            </div>
        </div>

        <div id="step-3" class="step">
            <div id="casinoCard" class="casino-ui">
                <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom:20px">
                    <span onclick="goToLobby()" style="color:var(--gold); font-weight:800; cursor:pointer" class="hide-on-spin">&larr; EXIT</span>
                    <h2 style="font-family:'Goldman'; color:var(--gold); margin:0">LAS VEGAS</h2>
                    <span id="displayMoney" style="color:#00ff88; font-weight:800">Rp 0</span>
                </div>

                <div class="slot-window">
                    <div id="reel1" class="reel-column"><div class="slot-item">💰</div></div>
                    <div id="reel2" class="reel-column"><div class="slot-item">💰</div></div>
                    <div id="reel3" class="reel-column"><div class="slot-item">💰</div></div>
                </div>

                <div class="hide-on-spin">
                    <input type="number" id="betInput" style="width:100%; background:#222; border:2px solid var(--gold); padding:15px; border-radius:15px; color:#fff; text-align:center; font-weight:800; margin-bottom:15px" placeholder="BET AMOUNT">
                    <button class="btn-modern btn-casino-entry" style="width:100%" onclick="playGame()">SPIN MACHINE</button>
                </div>
                
                <div id="spinText" style="display:none; text-align:center; font-family:'Goldman'; color:var(--gold); font-size:20px; animation: pulse 1s infinite">ROLLING...</div>
            </div>
        </div>
    </div>

    <script>
        const SECRET = "dimas_ganteng_123";
        const SYMS = ['💎','🍒','💰','🔔','7️⃣','⭐','🍇','🍉'];
        let userData = {};
        let intervals = [null, null, null];

        function showPopup(msg) {
            const p = document.getElementById('customPopup');
            p.innerText = msg; p.classList.add('show');
            setTimeout(() => p.classList.remove('show'), 3000);
        }

        async function checkAccount() {
            const num = document.getElementById('phoneInput').value;
            if(!num) return showPopup("MASUKKAN NOMOR!");
            try {
                const res = await fetch(`/api/slot-web`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nomor: num, secret: SECRET, type: 'check' })
                });
                const data = await res.json();
                if(data.status) {
                    userData = { nomor: num, ...data.profile };
                    updateUI(data.profile);
                    showStep(2);
                } else { showPopup(data.msg); }
            } catch(e) { showPopup("SERVER ERROR"); }
        }

        function updateUI(p) {
            document.getElementById('pName').innerText = p.name;
            document.getElementById('pUang').innerText = "Rp " + p.uang.toLocaleString();
            document.getElementById('displayMoney').innerText = "Rp " + p.uang.toLocaleString();
            document.getElementById('pLimit').innerText = p.limit;
            document.getElementById('pImg').src = p.img;
        }

        function showStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step-'+n).classList.add('active');
            
            // Perubahan Tema Body
            if(n === 3) {
                document.getElementById('mainBody').classList.add('casino-mode');
                document.getElementById('casinoCard').style.display = 'block';
            } else {
                document.getElementById('mainBody').classList.remove('casino-mode');
            }
        }

        function goToCasino() { showStep(3); }
        function goToLobby() { showStep(2); }

        function animateReel(idx) {
            const reel = document.getElementById('reel' + (idx + 1));
            let pos = 0;
            intervals[idx] = setInterval(() => {
                pos -= 20;
                if(pos <= -120) {
                    pos = 0;
                    reel.innerHTML = `<div class="slot-item">${SYMS[Math.floor(Math.random()*SYMS.length)]}</div>` + 
                                     `<div class="slot-item">${SYMS[Math.floor(Math.random()*SYMS.length)]}</div>`;
                }
                reel.style.transform = `translateY(${pos}px)`;
            }, 30);
        }

        async function playGame() {
            const bet = parseInt(document.getElementById('betInput').value);
            if(!bet || bet < 5000) return showPopup("MIN 5,000!");

            // ACTIVATE SPINNING MODE
            const casinoCard = document.getElementById('casinoCard');
            const spinText = document.getElementById('spinText');
            casinoCard.classList.add('is-spinning');
            spinText.style.display = 'block';

            animateReel(0); animateReel(1); animateReel(2);

            try {
                const res = await fetch(`/api/slot-web`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nomor: userData.nomor, amount: bet, secret: SECRET })
                });
                const data = await res.json();

                if(data.status) {
                    [0, 1, 2].forEach(i => {
                        setTimeout(() => {
                            clearInterval(intervals[i]);
                            const reel = document.getElementById('reel' + (i + 1));
                            reel.style.transform = "translateY(0)";
                            reel.innerHTML = `<div class="slot-item">${data.reels[i]}</div>`;
                        }, 1500 + (i * 800));
                    });

                    setTimeout(() => {
                        casinoCard.classList.remove('is-spinning');
                        spinText.style.display = 'none';
                        showPopup(data.resultStatus);
                        checkAccount(); // Sync saldo terbaru
                    }, 3800);
                } else { throw new Error(data.msg); }
            } catch(e) {
                intervals.forEach(clearInterval);
                casinoCard.classList.remove('is-spinning');
                spinText.style.display = 'none';
                showPopup(e.message);
            }
        }
    </script>
</body>
</html>
