<style>
    /* WRAPPER UTAMA */
    .lobby-wrapper {
        display: flex;
        flex-direction: column;
        gap: 12px; 
        width: 100%;
        align-items: center;
    }

    /* CARD PROFIL */
    .profile-card {
        background: var(--card-dark);
        border-radius: 35px;
        padding: 25px 20px;
        width: 100%;
        text-align: center;
        border: 1px solid rgba(255,255,255,0.03);
        box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        margin-bottom: 5px;
    }

    #pImg {
        width: 80px; height: 80px;
        border-radius: 50%;
        border: 3px solid #333;
        object-fit: cover;
    }

    #pName { margin: 10px 0 0 0; font-size: 18px; color: #fff; font-family: 'Goldman'; }
    
    .verify-tag {
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 2px;
        margin-top: 5px;
        text-transform: uppercase;
    }

    /* STATS ROW */
    .stats-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        width: 100%;
    }

    .stat-mini-box {
        background: #121212;
        padding: 12px;
        border-radius: 18px;
        border: 1px solid #222;
        text-align: center;
    }

    .stat-label { font-size: 8px; color: #555; font-weight: 800; display: block; margin-bottom: 2px; }
    .stat-value { font-family: 'Goldman'; font-size: 13px; }

    /* MENU GAME SELECTION */
    .menu-title {
        width: 100%;
        text-align: left;
        font-size: 10px;
        font-weight: 800;
        color: #444;
        letter-spacing: 1px;
        margin: 10px 0 5px 5px;
    }

    .game-menu {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
    }

    /* BUTTON GAYA BARU (CASINO GAMES) */
    .btn-game {
        width: 100%;
        padding: 18px 20px;
        border-radius: 20px;
        border: 1px solid rgba(255,255,255,0.05);
        background: #161616;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        transition: 0.3s;
        text-decoration: none;
    }

    /* Game Ready Style */
    .game-ready {
        background: linear-gradient(135deg, #1a1a1a, #222);
        border-left: 4px solid var(--gold);
    }
    .game-ready:active { transform: scale(0.97); background: #222; }
    .game-ready .game-name { color: var(--gold); font-family: 'Goldman'; font-size: 15px; }
    .game-ready .status-text { color: #00ff88; font-size: 9px; font-weight: 800; }

    /* Game Coming Soon Style */
    .game-soon {
        opacity: 0.5;
        cursor: not-allowed;
        filter: grayscale(1);
    }
    .game-soon .game-name { color: #888; font-family: 'Goldman'; font-size: 15px; }
    .game-soon .status-text { color: #555; font-size: 9px; font-weight: 800; border: 1px solid #333; padding: 2px 8px; border-radius: 10px; }

    /* WARNA STATUS */
    .status-owner { color: #ff3e3e !important; }
    .status-premium { color: var(--gold) !important; }

</style>

<div class="lobby-wrapper">
    <div class="profile-card">
        <img id="pImg" src="https://telegra.ph/file/default.jpg">
        <h2 id="pName">...</h2>
        <div id="pStatus" class="verify-tag">ACCOUNT VERIFIED</div>
    </div>

    <div class="stats-container">
        <div class="stat-mini-box">
            <span class="stat-label">CREDITS</span>
            <span id="pUang" class="stat-value" style="color: #00ff88;">Rp 0</span>
        </div>
        <div class="stat-mini-box">
            <span class="stat-label">LIMIT</span>
            <span id="pLimit" class="stat-value" style="color: #fff;">0</span>
        </div>
    </div>

    <div class="menu-title">SELECT CATEGORY</div>
    <div class="game-menu">
        
        <div class="btn-game game-ready" onclick="navigateTo('step3')">
            <div style="text-align: left;">
                <span class="game-name">CASINO SLOT</span><br>
                <small style="color: #666; font-size: 9px;">Classic 3-Reel Machine</small>
            </div>
            <span class="status-text">PLAY NOW ›</span>
        </div>

        <div class="btn-game game-soon">
            <div style="text-align: left;">
                <span class="game-name">ROULETTE ROYALE</span><br>
                <small style="color: #444; font-size: 9px;">European Table Game</small>
            </div>
            <span class="status-text">SOON</span>
        </div>

        <div class="btn-game game-soon">
            <div style="text-align: left;">
                <span class="game-name">ASTRONOT DESTROYER</span><br>
                <small style="color: #444; font-size: 9px;">Multiplier Crash Game</small>
            </div>
            <span class="status-text">SOON</span>
        </div>

    </div>

    <p style="font-size: 8px; color: #222; font-weight: 700; margin-top: 15px; letter-spacing: 2px;">MIWA MULTI-GAME ENGINE v1.0</p>
</div>

<script>
    (function() {
        const user = userData.profile;
        const nameEl = document.getElementById('pName');
        const imgEl = document.getElementById('pImg');
        const statusTag = document.getElementById('pStatus');

        nameEl.innerText = user.name || "User";
        document.getElementById('pUang').innerText = "Rp " + user.uang.toLocaleString();
        document.getElementById('pLimit').innerText = user.limit;
        if(user.pp) imgEl.src = user.pp;

        // LOGIKA WARNA STATUS
        if (user.owner) {
            statusTag.innerText = "OWNER 👑";
            statusTag.className = "verify-tag status-owner";
            imgEl.style.borderColor = "#ff3e3e";
        } else if (user.premium) {
            statusTag.innerText = "PREMIUM ✨";
            statusTag.className = "verify-tag status-premium";
            imgEl.style.borderColor = "var(--gold)";
        } else {
            statusTag.style.color = "#555";
            imgEl.style.borderColor = "#333";
        }
    })();
</script>
