<style>
    /* WRAPPER & RESPONSIVE */
    .slot-container {
        display: flex;
        flex-direction: column;
        gap: 15px;
        width: 100%;
        align-items: center;
        perspective: 1000px;
    }

    /* CARD UTAMA */
    .casino-ui {
        background: radial-gradient(circle at top, #1a1a1a 0%, #050505 100%);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 204, 0, 0.25);
        border-radius: 40px;
        padding: 25px 15px;
        box-shadow: 0 20px 60px rgba(0,0,0,1);
        position: relative;
        width: 100%;
        overflow: hidden; /* Penting untuk efek tombol meluncur */
    }

    /* LOGO EMAS METALIK */
    .logo-text {
        font-family: 'Goldman';
        background: linear-gradient(to bottom, #fff7ad 0%, #ffa200 50%, #b87333 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0;
        font-size: 18px;
        letter-spacing: 2px;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .game-header {
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 20px;
        padding: 0 5px;
    }

    /* FIX: SLOT WINDOW (TIDAK AKAN POTONG BUAH KE-3) */
    .slot-window { 
        height: 130px; 
        background: #000; 
        border-radius: 25px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        gap: 8px; 
        padding: 0 10px; 
        overflow: hidden; 
        border: 4px solid #111; 
        margin-bottom: 25px; 
        position: relative; 
        box-shadow: inset 0 10px 20px #000, inset 0 -10px 20px #000;
        width: 100%;
    }

    .slot-window::after { 
        content: ''; position: absolute; top:0; left:0; width:100%; height:100%; 
        background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.8) 100%);
        z-index: 5; pointer-events: none; 
    }

    .reel-column { 
        flex: 1; 
        max-width: 85px; /* Ukuran kolom pas untuk HP */
        height: 130px; 
        background: linear-gradient(to right, #050505, #151515, #050505);
        border-radius: 12px;
        overflow: hidden;
        position: relative;
    }

    .reel-strip { 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        position: absolute; 
        width: 100%; 
        left: 0; 
        top: 0; 
    }

    .slot-item { 
        height: 130px; 
        min-height: 130px;
        display: flex; 
        align-items: center; 
        justify-content: center; 
        font-size: 55px; /* Ukuran emoji pas */
        filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
    }

    /* ANIMASI TOMBOL HILANG/MUNCUL */
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        opacity: 1;
        transform: translateY(0);
    }

    .hide-controls {
        opacity: 0;
        transform: translateY(120px);
        pointer-events: none;
    }

    /* INPUT & TOMBOL 3D */
    #betInput {
        width: 100%; background: #000; border: 2px solid #1a1a1a; padding: 18px; 
        border-radius: 20px; color: #fff; text-align: center; font-family: 'Goldman'; font-size: 20px; outline: none;
    }

    .btn-spin {
        width: 100%; padding: 20px; border-radius: 20px; border: none; 
        background: linear-gradient(to bottom, #ffe066 0%, #ffb700 50%, #e6a400 100%); 
        color: #442200; font-family: 'Goldman'; font-weight: 900; font-size: 16px; 
        cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
        box-shadow: 0 8px 0 #996e00, 0 15px 30px rgba(0,0,0,0.4);
        transition: 0.1s;
    }
    .btn-spin:active { transform: translateY(4px); box-shadow: 0 4px 0 #996e00; }
    
    /* STYLE SAAT COOLDOWN */
    .btn-spin.cooldown-active {
        background: linear-gradient(to bottom, #333, #111) !important;
        color: #555 !important;
        box-shadow: 0 4px 0 #000 !important;
        cursor: not-allowed;
        transform: translateY(4px);
    }

    /* INFO & STATUS */
    .status-badge { font-size: 8px; padding: 4px 10px; border-radius: 50px; font-weight: 800; letter-spacing: 1.5px; margin-top: 5px; display: inline-block; }
    .badge-prem { background: var(--gold); color: #000; box-shadow: 0 0 15px rgba(255, 204, 0, 0.4); }
    .badge-free { background: #222; color: #666; }
</style>

<div class="slot-container">
    <div class="casino-ui">
        <div class="game-header">
            <div onclick="navigateTo('step2')" style="cursor:pointer; opacity: 0.5;">
                <span style="font-size: 20px; color: var(--gold);">‹ EXIT</span>
            </div>
            
            <div style="text-align: center;">
                <h2 class="logo-text">MIWA SLOT</h2>
                <div id="userStatusBadge" class="status-badge badge-free">LOADING</div>
            </div>

            <div style="text-align: right;">
                <small style="font-size: 7px; color: #555; font-weight: 800; letter-spacing: 1px;">BALANCE</small><br>
                <span id="displayMoney" style="color:#00ff88; font-weight:800; font-size: 14px; text-shadow: 0 0 10px rgba(0,255,136,0.2);">Rp 0</span>
            </div>
        </div>

        <div class="slot-window">
            <div class="reel-column"><div id="strip1" class="reel-strip"></div></div>
            <div class="reel-column"><div id="strip2" class="reel-strip"></div></div>
            <div class="reel-column"><div id="strip3" class="reel-strip"></div></div>
        </div>

        <div id="ui-controls" class="control-group">
            <div style="position: relative;">
                <small style="position: absolute; top: -8px; left: 20px; background: #080808; padding: 0 10px; font-size: 8px; color: #444; font-weight: 800;">BET AMOUNT</small>
                <input type="number" id="betInput" placeholder="0">
            </div>
            <button class="btn-spin" id="spinBtn" onclick="playGame()">SPIN MACHINE</button>
        </div>
    </div>
    <p style="font-size: 9px; color: #222; font-weight: 700; letter-spacing: 2px;">SECURE RNG SYSTEM v4.2</p>
</div>

<script>
    (function() {
        const badge = document.getElementById('userStatusBadge');
        if (userData.profile.premium) {
            badge.innerText = "PREMIUM ✨";
            badge.className = "status-badge badge-prem";
        } else {
            badge.innerText = "REGULAR";
            badge.className = "status-badge badge-free";
        }
    })();
</script>
