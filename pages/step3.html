<style>
    /* WRAPPER UTAMA GAYA CASINO MODERN */
    .slot-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 100%;
        align-items: center;
    }

    .casino-ui {
        background: rgba(10, 10, 10, 0.9);
        backdrop-filter: blur(15px);
        border: 2px solid var(--gold);
        border-radius: 45px;
        padding: 30px 20px;
        box-shadow: 0 0 40px rgba(255, 204, 0, 0.15), inset 0 0 20px rgba(0,0,0,1);
        position: relative;
        width: 100%;
    }

    /* HEADER UI */
    .game-header {
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 25px;
        padding: 0 10px;
    }

    /* FIX LAYOUT SLOT WINDOW */
    .slot-window { 
        height: 140px; /* Sedikit lebih tinggi biar lega */
        background: #000; 
        border-radius: 30px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        gap: 12px; 
        padding: 0 15px; 
        overflow: hidden; 
        border: 3px solid #1a1a1a; 
        margin-bottom: 25px; 
        position: relative; 
        box-shadow: inset 0 0 30px #000;
    }

    /* Efek Bayangan Realistis di Slot */
    .slot-window::before { 
        content: ''; position: absolute; top:0; left:0; width:100%; height:100%; 
        background: linear-gradient(to bottom, 
            rgba(0,0,0,1) 0%, 
            rgba(0,0,0,0) 25%, 
            rgba(0,0,0,0) 75%, 
            rgba(0,0,0,1) 100%);
        z-index: 5; pointer-events: none; 
    }

    .reel-column { 
        width: 85px; 
        height: 140px; 
        position: relative; 
        overflow: hidden; 
        background: #080808;
        border-radius: 15px;
    }

    .reel-strip { 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        position: absolute; 
        width: 100%; 
        left: 0; 
        top: 0; 
    }

    .slot-item { 
        height: 140px; 
        min-height: 140px; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        font-size: 60px; /* Emoji lebih besar & jelas */
        filter: drop-shadow(0 0 5px rgba(255,255,255,0.1));
    }

    /* STATUS & INFO */
    .status-badge {
        font-size: 10px;
        padding: 5px 12px;
        border-radius: 50px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
    }
    .badge-prem { background: var(--gold); color: #000; box-shadow: 0 0 15px rgba(255, 204, 0, 0.4); }
    .badge-free { background: #222; color: #555; }

    /* CONTROLS (FULL VERTICAL) */
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
    }

    #betInput {
        width: 100%; 
        background: #000; 
        border: 2px solid #222; 
        padding: 20px; 
        border-radius: 25px; 
        color: var(--gold); 
        text-align: center; 
        font-family: 'Goldman'; 
        font-size: 22px;
        outline: none;
        transition: 0.3s;
    }
    #betInput:focus { border-color: var(--accent-blue); }

    .btn-spin {
        width: 100%; 
        padding: 22px; 
        border-radius: 25px; 
        border: none; 
        background: linear-gradient(180deg, var(--gold), var(--gold-dark)); 
        color: #000; 
        font-family: 'Goldman'; 
        font-weight: 800; 
        font-size: 18px; 
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(255, 204, 0, 0.3);
        transition: 0.2s;
    }
    .btn-spin:active { transform: scale(0.95); }
    .btn-spin:disabled { opacity: 0.5; filter: grayscale(1); }

</style>

<div class="slot-container">
    <div class="casino-ui">
        <div class="game-header">
            <div onclick="navigateTo('step2')" style="cursor:pointer; display: flex; align-items:center; gap: 5px;">
                <span style="font-size: 18px; color: var(--gold);">←</span>
                <span style="font-size: 11px; font-weight: 800; color: var(--gold); letter-spacing: 1px;">EXIT</span>
            </div>
            
            <div style="text-align: center;">
                <h2 style="font-family:'Goldman'; color:var(--gold); margin:0; font-size: 18px; letter-spacing: 2px;">MIWA SLOT</h2>
                <div id="userStatusBadge" class="status-badge badge-free">LOADING</div>
            </div>

            <div style="text-align: right;">
                <small style="display:block; font-size: 8px; color: var(--text-dim); margin-bottom: 2px;">BALANCE</small>
                <span id="displayMoney" style="color:#00ff88; font-weight:800; font-size: 14px;">Rp 0</span>
            </div>
        </div>

        <div class="slot-window">
            <div class="reel-column"><div id="strip1" class="reel-strip"></div></div>
            <div class="reel-column"><div id="strip2" class="reel-strip"></div></div>
            <div class="reel-column"><div id="strip3" class="reel-strip"></div></div>
        </div>

        <div class="control-group">
            <div style="position: relative;">
                <small style="position: absolute; top: -8px; left: 20px; background: #0a0a0a; padding: 0 10px; font-size: 9px; color: var(--text-dim); font-weight: 800; letter-spacing: 1px;">BET AMOUNT</small>
                <input type="number" id="betInput" placeholder="0">
            </div>
            <button class="btn-spin" id="spinBtn" onclick="playGame()">SPIN MACHINE</button>
        </div>
    </div>

    <p style="font-size: 10px; color: #444; font-weight: 700; letter-spacing: 1px;">PROVABLY FAIR SYSTEM • RNG v4.2</p>
</div>

<script>
    (function() {
        const badge = document.getElementById('userStatusBadge');
        if (userData.profile.premium) {
            badge.innerText = "PREMIUM ✨";
            badge.className = "status-badge badge-prem";
        } else {
            badge.innerText = "NORMAL";
            badge.className = "status-badge badge-free";
        }
    })();
</script>
